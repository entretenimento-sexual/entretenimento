name: Registration Visual Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'angular.json'
      - 'src/app/register-module/**'
      - 'src/app/footer/**'
      - 'src/app/layout/layout-shell/**'
      - 'src/app/compliance/age-verification-page/**'
      - 'src/app/compliance/age-reverification-page/**'
      - 'src/app/account/guards/account-lifecycle.guard.ts'
      - 'src/app/core/guards/**'
      - 'src/app/core/services/autentication/register/**'
      - 'src/app/core/services/compliance/**'
      - 'src/styles/**'
      - '.github/workflows/registration-visual-validation.yml'

permissions:
  contents: read

concurrency:
  group: registration-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registration-visual:
    name: Registration visual (${{ matrix.configuration }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - development
          - production
          - dev-emu

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build selected environment
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.configuration }}" in
            development)
              npm run build:dev
              ;;
            production)
              npm run build:prod
              ;;
            dev-emu)
              npm run build:emu
              ;;
            *)
              echo "Unsupported configuration: ${{ matrix.configuration }}" >&2
              exit 1
              ;;
          esac

      - name: Install Playwright CLI and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @playwright/cli@0.1.17
          playwright-cli install-browser --with-deps

      - name: Start Auth emulator for dev-emu
        if: ${{ matrix.configuration == 'dev-emu' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "artifacts/${{ matrix.configuration }}"
          nohup npx firebase emulators:start \
            --only auth \
            --project demo-registration-visual \
            > "artifacts/${{ matrix.configuration }}/auth-emulator.log" 2>&1 &
          echo $! > "artifacts/${{ matrix.configuration }}/auth-emulator.pid"

          for attempt in $(seq 1 90); do
            if (echo > /dev/tcp/127.0.0.1/9099) >/dev/null 2>&1; then
              echo "Auth emulator ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done

          echo "Auth emulator did not become ready" >&2
          cat "artifacts/${{ matrix.configuration }}/auth-emulator.log" >&2 || true
          exit 1

      - name: Start Angular for visual inspection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "artifacts/${{ matrix.configuration }}"
          VISUAL_CONFIGURATION="${{ matrix.configuration }}-registration-visual"

          nohup npx ng serve \
            --configuration="$VISUAL_CONFIGURATION" \
            --host=127.0.0.1 \
            --port=4200 \
            > "artifacts/${{ matrix.configuration }}/ng-serve.log" 2>&1 &
          echo $! > "artifacts/${{ matrix.configuration }}/ng-serve.pid"

          for attempt in $(seq 1 180); do
            if curl --fail --silent --show-error http://127.0.0.1:4200/register >/dev/null; then
              echo "Angular visual harness ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done

          echo "Angular did not become ready" >&2
          cat "artifacts/${{ matrix.configuration }}/ng-serve.log" >&2 || true
          exit 1

      - name: Capture desktop and mobile registration states
        shell: bash
        env:
          PLAYWRIGHT_CLI_SESSION: registration-${{ matrix.configuration }}
        run: |
          set -euo pipefail
          OUT="artifacts/${{ matrix.configuration }}"
          URL="http://127.0.0.1:4200/register"

          CHECK_SIGNUP_PHOTO=$(cat <<'PLAYWRIGHT'
          async (page) => {
            const backdrop = page.locator('.signup-backdrop');
            await backdrop.evaluate(image => image.decode());
            const framing = await backdrop.evaluate(image => {
              const box = image.getBoundingClientRect();
              const position = getComputedStyle(image).objectPosition.split(' ');
              const scale = Math.max(box.width / image.naturalWidth, box.height / image.naturalHeight);
              const width = image.naturalWidth * scale;
              const height = image.naturalHeight * scale;
              const x = box.left + (box.width - width) * parseFloat(position[0]) / 100;
              const y = box.top + (box.height - height) * parseFloat(position[1]) / 100;
              // Bounds of the two heads in the source image.
              const faces = { left: x + width * 0.07, right: x + width * 0.535, top: y + height * 0.026, bottom: y + height * 0.46 };
              const header = document.querySelector('app-navbar').getBoundingClientRect();
              const form = document.querySelector('.form-container').getBoundingClientRect();
              const insidePhoto = faces.left >= box.left && faces.right <= box.right &&
                faces.top >= Math.max(box.top, header.bottom) && faces.bottom <= box.bottom;
              const clearOfForm = faces.right <= form.left || faces.left >= form.right ||
                faces.bottom <= form.top || faces.top >= form.bottom;
              return { faces, insidePhoto, clearOfForm };
            });
            if (!framing.insidePhoto || !framing.clearOfForm) {
              throw new Error('Signup portrait is cropped or covered by the form: ' + JSON.stringify(framing));
            }
            const clip = {
              x: Math.floor((framing.faces.left + framing.faces.right) / 2) - 48,
              y: Math.floor((framing.faces.top + framing.faces.bottom) / 2) - 32,
              width: 96,
              height: 64,
            };
            const painted = await page.screenshot({ clip, animations: 'disabled' });
            const hidden = await page.screenshot({
              clip,
              animations: 'disabled',
              style: '.signup-backdrop { visibility: hidden !important; }',
            });

            const changed = await page.evaluate(async ([painted, hidden]) => {
              const canvas = document.createElement('canvas');
              canvas.width = 96;
              canvas.height = 64;
              const context = canvas.getContext('2d', { willReadFrequently: true });
              async function pixels(base64) {
                const image = new Image();
                image.src = 'data:image/png;base64,' + base64;
                await image.decode();
                context.drawImage(image, 0, 0);
                return context.getImageData(0, 0, canvas.width, canvas.height).data;
              }
              const before = await pixels(painted);
              const after = await pixels(hidden);
              let different = 0;
              for (let i = 0; i < before.length; i += 4) {
                const delta = Math.abs(before[i] - after[i]) +
                  Math.abs(before[i + 1] - after[i + 1]) +
                  Math.abs(before[i + 2] - after[i + 2]);
                if (delta > 24) different++;
              }
              return different / (canvas.width * canvas.height);
            }, [painted.toString('base64'), hidden.toString('base64')]);

            if (changed < 0.15) {
              throw new Error('Signup backdrop is loaded but not visible in the screenshot. Changed pixel ratio: ' + changed);
            }
            return { changedPixelRatio: changed, faces: framing.faces };
          }
          PLAYWRIGHT
          )

          playwright-cli open "$URL"

          playwright-cli resize 1920 520
          playwright-cli run-code "$CHECK_SIGNUP_PHOTO" | tee "$OUT/short-desktop-framing.log"
          playwright-cli screenshot --full-page --filename="$OUT/short-desktop-framing.png"

          playwright-cli resize 320 640
          playwright-cli run-code "$CHECK_SIGNUP_PHOTO" | tee "$OUT/narrow-mobile-framing.log"
          playwright-cli screenshot --full-page --filename="$OUT/narrow-mobile-framing.png"

          playwright-cli resize 1440 1000
          playwright-cli reload
          playwright-cli snapshot --filename="$OUT/desktop-initial.accessibility.yml"
          playwright-cli screenshot --full-page --filename="$OUT/desktop-initial.png"
          playwright-cli run-code "$CHECK_SIGNUP_PHOTO" | tee "$OUT/desktop-photo-paint.log"
          playwright-cli run-code "async (page) => {
            await page.locator('.signup-backdrop').evaluate(image => image.decode());
            const metrics = await page.evaluate(() => ({
              viewportWidth: window.innerWidth,
              viewportHeight: window.innerHeight,
              scrollWidth: document.documentElement.scrollWidth,
              scrollHeight: document.documentElement.scrollHeight,
              introVisible: !!document.querySelector('.form-container form > header')?.getClientRects().length,
              title: document.querySelector('#register-section-title')?.textContent?.trim() || '',
              submitVisible: !!document.querySelector('button[type=submit]')?.getClientRects().length,
              nicknameVisible: !!document.querySelector('#apelidoPrincipal')?.getClientRects().length,
              laterFieldsPresent: !!document.querySelector('#email, #password, #maioridade-inicial, #termos'),
              viewportImage: document.querySelector('.signup-image')?.getBoundingClientRect().toJSON(),
              bodyWidth: document.documentElement.clientWidth,
              bodyHeight: document.documentElement.clientHeight,
              photoSource: document.querySelector('.signup-backdrop')?.currentSrc.endsWith('signup-shadow.webp'),
              footerCount: document.querySelectorAll('.public-footer').length,
              footer: document.querySelector('.public-footer--compact')?.getBoundingClientRect().toJSON(),
              footerDocs: Array.from(document.querySelectorAll('.public-footer--compact nav.legal-top a'), link => link.getAttribute('href')),
              formStart: document.querySelector('.form-container')?.getBoundingClientRect().left ?? 0,
              formHeight: document.querySelector('.form-container')?.getBoundingClientRect().height ?? 0,
              nicknameRow: Math.abs(
                (document.querySelector('#apelidoPrincipal')?.getBoundingClientRect().top ?? 0) -
                (document.querySelector('#complementoApelido')?.getBoundingClientRect().top ?? 0)
              ) <= 8,
              nextAction: document.querySelector('app-register-progress .next strong')?.textContent?.trim(),
            }));
            console.log(JSON.stringify(metrics));
            if (metrics.scrollWidth > metrics.viewportWidth + 1) {
              throw new Error('Desktop initial state has horizontal overflow');
            }
            if (!metrics.introVisible || !metrics.title || !metrics.submitVisible) {
              throw new Error('Desktop initial registration shell is incomplete');
            }
            if (!metrics.nicknameVisible || metrics.laterFieldsPresent) {
              throw new Error('Desktop must start with only the nickname fields');
            }
            if (!metrics.photoSource || !metrics.viewportImage || Math.abs(metrics.viewportImage.width - metrics.bodyWidth) > 1 || Math.abs(metrics.viewportImage.height - metrics.bodyHeight) > 1) {
              throw new Error('Desktop must show the photographic background across the viewport');
            }
            if (Math.abs(metrics.viewportImage.bottom - metrics.viewportHeight) > 2 ||
                metrics.footerCount !== 1 || !metrics.footer || Math.abs(metrics.footer.bottom - metrics.viewportHeight) > 2 ||
                metrics.footer.height > 60 || metrics.footerDocs.length !== 3 ||
                metrics.footerDocs.some(path => !['/politica-de-privacidade', '/termos-e-condicoes', '/politica-de-cookies'].includes(path))) {
              throw new Error('Desktop signup must show the compact legal footer and the photo within the first viewport');
            }
            if (!metrics.nicknameRow || !metrics.formHeight || metrics.formHeight > 420) {
              throw new Error('Desktop signup form must keep the nickname fields in a compact row');
            }
            if (metrics.formStart < metrics.viewportWidth * 0.52 || metrics.nextAction !== 'Configure seu acesso') {
              throw new Error('Desktop must keep the form to the right and show the next signup screen');
            }
            return metrics;
          }" | tee "$OUT/desktop-initial.metrics.log"

          playwright-cli click "button[type='submit']"
          playwright-cli run-code "async (page) => {
            await page.waitForTimeout(250);
            const metrics = await page.evaluate(() => {
              const isVisible = (el) => !!el.getClientRects().length;
              const errors = Array.from(document.querySelectorAll('.tooltip-error')).filter(isVisible);
              const overlaps = [];

              for (const error of errors) {
                const owner = error.closest('.form-field, .form-checkbox');
                if (!owner) continue;
                let next = owner.nextElementSibling;
                while (next && !next.matches('.form-field, .form-checkbox, button[type=submit]')) {
                  next = next.nextElementSibling;
                }
                if (!next) continue;
                const errorRect = error.getBoundingClientRect();
                const nextRect = next.getBoundingClientRect();
                if (errorRect.bottom > nextRect.top + 1) {
                  overlaps.push({ id: error.id, bottom: errorRect.bottom, nextTop: nextRect.top });
                }
              }

              return {
                viewportWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                visibleErrors: errors.length,
                accessibleErrors: errors.filter((el) =>
                  el.getAttribute('role') === 'alert' &&
                  el.getAttribute('aria-live') === 'polite'
                ).length,
                outOfViewportErrors: errors
                  .map((el) => ({ id: el.id, ...el.getBoundingClientRect().toJSON() }))
                  .filter((rect) => rect.left < -1 || rect.right > window.innerWidth + 1),
                overlaps,
              };
            });
            console.log(JSON.stringify(metrics));
            if (metrics.scrollWidth > metrics.viewportWidth + 1) {
              throw new Error('Desktop invalid state has horizontal overflow');
            }
            if (metrics.visibleErrors !== 1) {
              throw new Error('Desktop invalid state must show only the nickname error');
            }
            if (metrics.accessibleErrors !== metrics.visibleErrors) {
              throw new Error('Desktop invalid feedback lost alert/live-region semantics');
            }
            if (metrics.outOfViewportErrors.length) {
              throw new Error('Desktop invalid feedback escaped the viewport');
            }
            if (metrics.overlaps.length) {
              throw new Error('Desktop invalid feedback overlaps the following field');
            }
            return metrics;
          }" | tee "$OUT/desktop-invalid.metrics.log"
          playwright-cli snapshot --filename="$OUT/desktop-invalid.accessibility.yml"
          playwright-cli screenshot --full-page --filename="$OUT/desktop-invalid.png"

          playwright-cli resize 390 844
          playwright-cli reload
          playwright-cli snapshot --filename="$OUT/mobile-initial.accessibility.yml"
          playwright-cli screenshot --full-page --filename="$OUT/mobile-initial.png"
          playwright-cli run-code "$CHECK_SIGNUP_PHOTO" | tee "$OUT/mobile-photo-paint.log"
          playwright-cli run-code "async (page) => {
            await page.locator('.signup-backdrop').evaluate(image => image.decode());
            const metrics = await page.evaluate(() => {
              const formRect = document.querySelector('.form-container')?.getBoundingClientRect();
              const inputRect = document.querySelector('.signup-pair--nickname')?.getBoundingClientRect();
              return {
                viewportWidth: window.innerWidth,
                viewportHeight: window.innerHeight,
                scrollWidth: document.documentElement.scrollWidth,
                scrollHeight: document.documentElement.scrollHeight,
                viewportImage: document.querySelector('.signup-image')?.getBoundingClientRect().toJSON(),
                bodyWidth: document.documentElement.clientWidth,
                bodyHeight: document.documentElement.clientHeight,
                footer: document.querySelector('.public-footer--compact')?.getBoundingClientRect().toJSON(),
                formBottom: formRect?.bottom,
                formStart: formRect?.top ?? 0,
                formHeight: formRect?.height ?? 0,
                formVisible: !!document.querySelector('.form-container')?.getClientRects().length,
                submitVisible: !!document.querySelector('button[type=submit]')?.getClientRects().length,
                formWidth: formRect?.width ?? 0,
                firstInputWidth: inputRect?.width ?? 0,
              };
            });
            console.log(JSON.stringify(metrics));
            if (metrics.scrollWidth > metrics.viewportWidth + 1) {
              throw new Error('Mobile initial state has horizontal overflow');
            }
            if (!metrics.viewportImage || Math.abs(metrics.viewportImage.width - metrics.bodyWidth) > 1 || Math.abs(metrics.viewportImage.height - metrics.bodyHeight) > 1 || metrics.formStart < 190) {
              throw new Error('Mobile must show the artwork across the viewport and leave it visible above the form');
            }
            if (Math.abs(metrics.viewportImage.bottom - metrics.viewportHeight) > 2 || !metrics.footer ||
                Math.abs(metrics.footer.bottom - metrics.viewportHeight) > 2 || metrics.footer.top < metrics.formBottom ||
                metrics.footer.height > 94) {
              throw new Error('Mobile signup must fit the compact legal footer below the form within the first viewport');
            }
            if (!metrics.formVisible || !metrics.submitVisible || !metrics.formHeight || metrics.formHeight > 435) {
              throw new Error('Mobile initial registration form is incomplete');
            }
            if (metrics.formWidth < metrics.viewportWidth * 0.85) {
              throw new Error('Mobile form card is not using the available viewport width');
            }
            if (metrics.firstInputWidth < metrics.viewportWidth * 0.70) {
              throw new Error('Mobile form controls are compressed into a narrow column');
            }
            await page.getByRole('link', { name: 'Política de Privacidade' }).press('Enter');
            await page.waitForURL('**/politica-de-privacidade', { timeout: 10000 });
            await page.locator('#privacy-title').waitFor({ state: 'visible' });
            await page.goBack();
            await page.locator('.public-footer--compact').waitFor({ state: 'visible' });

            await page.setViewportSize({ width: 390, height: 500 });
            await page.locator('.public-footer--compact').scrollIntoViewIfNeeded();
            const scrolled = await page.evaluate(() => {
              const photo = document.querySelector('.signup-image').getBoundingClientRect();
              const footer = document.querySelector('.public-footer--compact').getBoundingClientRect();
              return { y: window.scrollY, height: innerHeight, photoBottom: photo.bottom, footerBottom: footer.bottom };
            });
            if (scrolled.y <= 0 || Math.abs(scrolled.photoBottom + scrolled.y - scrolled.height) > 2 ||
                scrolled.photoBottom >= scrolled.height || scrolled.footerBottom > scrolled.height + 1) {
              throw new Error('The photo must scroll with the document and stop at the first viewport boundary');
            }
            await page.setViewportSize({ width: 390, height: 844 });
            await page.evaluate(() => window.scrollTo(0, 0));
            return metrics;
          }" | tee "$OUT/mobile-initial.metrics.log"

          playwright-cli click "button[type='submit']"
          playwright-cli run-code "async (page) => {
            await page.waitForTimeout(250);
            const metrics = await page.evaluate(() => {
              const isVisible = (el) => !!el.getClientRects().length;
              const errors = Array.from(document.querySelectorAll('.tooltip-error')).filter(isVisible);
              const overlaps = [];
              const formRect = document.querySelector('.form-container')?.getBoundingClientRect();
              const inputRect = document.querySelector('.signup-pair--nickname')?.getBoundingClientRect();

              for (const error of errors) {
                const owner = error.closest('.form-field, .form-checkbox');
                if (!owner) continue;
                let next = owner.nextElementSibling;
                while (next && !next.matches('.form-field, .form-checkbox, button[type=submit]')) {
                  next = next.nextElementSibling;
                }
                if (!next) continue;
                const errorRect = error.getBoundingClientRect();
                const nextRect = next.getBoundingClientRect();
                if (errorRect.bottom > nextRect.top + 1) {
                  overlaps.push({ id: error.id, bottom: errorRect.bottom, nextTop: nextRect.top });
                }
              }

              return {
                viewportWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                backdropDocumentBottom: document.querySelector('.signup-image')?.getBoundingClientRect().bottom + scrollY,
                viewportHeight: innerHeight,
                formWidth: formRect?.width ?? 0,
                firstInputWidth: inputRect?.width ?? 0,
                visibleErrors: errors.length,
                accessibleErrors: errors.filter((el) =>
                  el.getAttribute('role') === 'alert' &&
                  el.getAttribute('aria-live') === 'polite'
                ).length,
                outOfViewportErrors: errors
                  .map((el) => ({ id: el.id, ...el.getBoundingClientRect().toJSON() }))
                  .filter((rect) => rect.left < -1 || rect.right > window.innerWidth + 1),
                overlaps,
              };
            });
            console.log(JSON.stringify(metrics));
            if (metrics.scrollWidth > metrics.viewportWidth + 1) {
              throw new Error('Mobile invalid state has horizontal overflow');
            }
            if (Math.abs(metrics.backdropDocumentBottom - metrics.viewportHeight) > 2) {
              throw new Error('Validation feedback must keep the photo limited to the first viewport');
            }
            if (metrics.formWidth < metrics.viewportWidth * 0.85 || metrics.firstInputWidth < metrics.viewportWidth * 0.70) {
              throw new Error('Mobile invalid form lost its useful content width');
            }
            if (metrics.visibleErrors !== 1) {
              throw new Error('Mobile invalid state must show only the nickname error');
            }
            if (metrics.accessibleErrors !== metrics.visibleErrors) {
              throw new Error('Mobile invalid feedback lost alert/live-region semantics');
            }
            if (metrics.outOfViewportErrors.length) {
              throw new Error('Mobile invalid feedback escaped the viewport');
            }
            if (metrics.overlaps.length) {
              throw new Error('Mobile invalid feedback overlaps the following field');
            }
            return metrics;
          }" | tee "$OUT/mobile-invalid.metrics.log"
          playwright-cli snapshot --filename="$OUT/mobile-invalid.accessibility.yml"
          playwright-cli screenshot --full-page --filename="$OUT/mobile-invalid.png"

          playwright-cli run-code "async (page) => {
            await page.route('**/getRegistrationNicknameAvailability', route => route.fulfill({
              status: 200,
              headers: {
                'access-control-allow-origin': '*',
                'access-control-allow-methods': 'POST, OPTIONS',
                'access-control-allow-headers': '*',
              },
              json: { result: { status: 'unconfirmed' } },
            }));
            await page.locator('#apelidoPrincipal').fill('visualteste');
            await page.locator('#complementoApelido').focus();
            const feedback = page.locator('.inline-feedback .badge').filter({ hasText: 'Sujeito à confirmação' });
            await feedback.waitFor({ state: 'visible' });
            const feedbackBox = await feedback.boundingBox();
            const nicknameField = await page.locator('.nickname-field').boundingBox();
            if (!feedbackBox || !nicknameField || feedbackBox.x + feedbackBox.width > nicknameField.x + nicknameField.width + 1) {
              throw new Error('Nickname feedback must fit inside its field column');
            }
            await page.locator('button[type=submit]').click();
            await page.locator('#email').waitFor({ state: 'visible' });
            if (await page.locator('app-register-progress .next strong').textContent() !== 'Confirme para criar a conta') {
              throw new Error('Access step must explain that confirmations come next');
            }
            if (await page.locator('#apelidoPrincipal, #maioridade-inicial, #termos').count()) {
              throw new Error('Access step must show only the credentials');
            }
            const password = await page.locator('#password').boundingBox();
            const confirmation = await page.locator('#confirmPassword').boundingBox();
            if (!password || !confirmation || Math.abs(password.y - confirmation.y) > 8 || Math.min(password.width, confirmation.width) < 90) {
              throw new Error('Access step must fit both password fields on a readable row at 390px');
            }
            await page.locator('#email').fill('visual@example.test');
            await page.locator('#password').fill('Teste123');
            await page.locator('#confirmPassword').fill('Teste123');
          }"
          playwright-cli screenshot --full-page --filename="$OUT/mobile-access.png"

          playwright-cli run-code "async (page) => {
            await page.locator('button[type=submit]').click();
            await page.locator('#maioridade-inicial').waitFor({ state: 'visible' });
            if (await page.locator('app-register-progress .next strong').textContent() !== 'Confirmar seu e-mail') {
              throw new Error('Confirmations must lead to email verification');
            }
            if (await page.locator('#apelidoPrincipal, #email, #password').count()) {
              throw new Error('Confirmations must be shown separately from credentials');
            }
          }"
          playwright-cli screenshot --full-page --filename="$OUT/mobile-confirmations.png"

          playwright-cli run-code "async (page) => {
            await page.getByRole('button', { name: 'Voltar', exact: true }).click();
            if (await page.locator('#email').inputValue() !== 'visual@example.test') {
              throw new Error('Going back must preserve the credentials in the form');
            }
          }"

          playwright-cli run-code "async (page) => {
            const context = page.context();
            const cdp = await context.newCDPSession(page);
            const email = page.locator('#email');
            try {
              await cdp.send('Emulation.setCPUThrottlingRate', { rate: 4 });
              await context.setOffline(true);
              await page.getByText('Sem conexão detectada', { exact: true }).waitFor({ state: 'visible' });
              await context.setOffline(false);
              await page.getByText('Conexão restabelecida', { exact: true }).waitFor({ state: 'visible' });
              if (await email.inputValue() !== 'visual@example.test') {
                throw new Error('Reconnecting must preserve the credentials in the signup form');
              }
            } finally {
              await context.setOffline(false);
              await cdp.send('Emulation.setCPUThrottlingRate', { rate: 1 });
              await cdp.detach();
            }
          }"

          playwright-cli console error > "$OUT/browser-console-errors.log" || true
          playwright-cli close

      - name: Capture onboarding flow surfaces
        shell: bash
        env:
          PLAYWRIGHT_CLI_SESSION: onboarding-${{ matrix.configuration }}
        run: |
          set -euo pipefail
          OUT="artifacts/${{ matrix.configuration }}/onboarding"
          BASE="http://127.0.0.1:4200"
          mkdir -p "$OUT/welcome" "$OUT/profile" "$OUT/terms" "$OUT/adult"

          playwright-cli open "$BASE/register/welcome?verificationEmail=failed"
          playwright-cli resize 1440 1000
          playwright-cli run-code "async (page) => {
            await page.waitForSelector('.welcome-card', { state: 'visible' });
            const metrics = await page.evaluate(() => {
              const root = document.querySelector('.welcome-container');
              const card = document.querySelector('.welcome-card');
              const alert = document.querySelector('.welcome-alert');
              const buttons = Array.from(document.querySelectorAll('.welcome-card button')).filter((el) => el.getClientRects().length);
              const rootRect = root?.getBoundingClientRect();
              return {
                viewportWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                rootWidth: rootRect?.width ?? 0,
                cardVisible: !!card?.getClientRects().length,
                alertVisible: !!alert?.getClientRects().length,
                buttonCount: buttons.length,
                shortButtons: buttons.filter((el) => el.getBoundingClientRect().height < 40).map((el) => el.textContent?.trim()),
              };
            });
            console.log(JSON.stringify(metrics));
            if (metrics.scrollWidth > metrics.viewportWidth + 1) throw new Error('Welcome desktop overflow');
            if (!metrics.cardVisible || !metrics.alertVisible || metrics.buttonCount < 4) throw new Error('Welcome desktop incomplete');
            if (metrics.shortButtons.length) throw new Error('Welcome desktop has undersized actions');
            return metrics;
          }" | tee "$OUT/welcome/desktop.metrics.log"
          playwright-cli snapshot --filename="$OUT/welcome/desktop.accessibility.yml"
          playwright-cli screenshot --full-page --filename="$OUT/welcome/desktop.png"

          playwright-cli resize 390 844
          playwright-cli reload
          playwright-cli run-code "async (page) => {
            await page.waitForSelector('.welcome-card', { state: 'visible' });
            const metrics = await page.evaluate(() => {
              const rootRect = document.querySelector('.welcome-container')?.getBoundingClientRect();
              const cardRect = document.querySelector('.welcome-card')?.getBoundingClientRect();
              const buttons = Array.from(document.querySelectorAll('.welcome-card button')).filter((el) => el.getClientRects().length);
              return {
                viewportWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                rootWidth: rootRect?.width ?? 0,
                cardWidth: cardRect?.width ?? 0,
                buttonCount: buttons.length,
                narrowButtons: buttons.filter((el) => el.getBoundingClientRect().width < (cardRect?.width ?? 0) * 0.75).map((el) => el.textContent?.trim()),
                shortButtons: buttons.filter((el) => el.getBoundingClientRect().height < 40).map((el) => el.textContent?.trim()),
              };
            });
            console.log(JSON.stringify(metrics));
            if (metrics.scrollWidth > metrics.viewportWidth + 1) throw new Error('Welcome mobile overflow');
            if (metrics.cardWidth < metrics.viewportWidth * 0.85) throw new Error('Welcome mobile card is too narrow');
            if (metrics.buttonCount < 4 || metrics.narrowButtons.length || metrics.shortButtons.length) throw new Error('Welcome mobile actions lost useful width or touch size');
            return metrics;
          }" | tee "$OUT/welcome/mobile.metrics.log"
          playwright-cli snapshot --filename="$OUT/welcome/mobile.accessibility.yml"
          playwright-cli screenshot --full-page --filename="$OUT/welcome/mobile.png"

          playwright-cli run-code "async (page) => {
            await page.goto('$BASE/register/finalizar-cadastro?reason=profile_incomplete');
            await page.waitForSelector('.form-container', { state: 'visible' });
            await page.waitForFunction(() => {
              const button = document.querySelector('.completion-submit');
              return button && !button.disabled;
            });
          }"
          playwright-cli resize 1440 1000
          playwright-cli run-code "async (page) => {
            const metrics = await page.evaluate(() => {
              const formRect = document.querySelector('.form-container')?.getBoundingClientRect();
              const inputRect = document.querySelector('#nickname')?.getBoundingClientRect();
              return {
                viewportWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                formWidth: formRect?.width ?? 0,
                firstInputWidth: inputRect?.width ?? 0,
                heroVisible: !!document.querySelector('.completion-hero')?.getClientRects().length,
                submitVisible: !!document.querySelector('.completion-submit')?.getClientRects().length,
              };
            });
            console.log(JSON.stringify(metrics));
            if (metrics.scrollWidth > metrics.viewportWidth + 1) throw new Error('Profile completion desktop overflow');
            if (!metrics.heroVisible || !metrics.submitVisible || metrics.formWidth < 320) throw new Error('Profile completion desktop incomplete');
            return metrics;
          }" | tee "$OUT/profile/desktop-initial.metrics.log"
          playwright-cli snapshot --filename="$OUT/profile/desktop-initial.accessibility.yml"
          playwright-cli screenshot --full-page --filename="$OUT/profile/desktop-initial.png"
          playwright-cli click ".completion-submit"
          playwright-cli run-code "async (page) => {
            await page.waitForSelector('.tooltip-error', { state: 'visible' });
            const metrics = await page.evaluate(() => {
              const errors = Array.from(document.querySelectorAll('.tooltip-error')).filter((el) => el.getClientRects().length);
              const overlaps = [];
              for (const error of errors) {
                const owner = error.closest('.form-field');
                const next = owner?.nextElementSibling;
                if (!next) continue;
                if (error.getBoundingClientRect().bottom > next.getBoundingClientRect().top + 1) {
                  overlaps.push(error.id);
                }
              }
              return {
                viewportWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                visibleErrors: errors.length,
                accessibleErrors: errors.filter((el) => el.getAttribute('role') === 'alert' && el.getAttribute('aria-live') === 'polite').length,
                overlaps,
              };
            });
            console.log(JSON.stringify(metrics));
            if (metrics.scrollWidth > metrics.viewportWidth + 1) throw new Error('Profile completion desktop invalid overflow');
            if (metrics.visibleErrors !== 4 || metrics.accessibleErrors !== 4 || metrics.overlaps.length) throw new Error('Profile completion desktop invalid feedback regression');
            return metrics;
          }" | tee "$OUT/profile/desktop-invalid.metrics.log"
          playwright-cli snapshot --filename="$OUT/profile/desktop-invalid.accessibility.yml"
          playwright-cli screenshot --full-page --filename="$OUT/profile/desktop-invalid.png"

          playwright-cli resize 390 844
          playwright-cli run-code "async (page) => {
            await page.goto('$BASE/register/finalizar-cadastro?reason=profile_incomplete');
            await page.waitForFunction(() => {
              const button = document.querySelector('.completion-submit');
              return button && !button.disabled;
            });
            const metrics = await page.evaluate(() => {
              const formRect = document.querySelector('.form-container')?.getBoundingClientRect();
              const inputRect = document.querySelector('#nickname')?.getBoundingClientRect();
              return {
                viewportWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                formWidth: formRect?.width ?? 0,
                firstInputWidth: inputRect?.width ?? 0,
                heroVisible: !!document.querySelector('.completion-hero')?.getClientRects().length,
              };
            });
            console.log(JSON.stringify(metrics));
            if (metrics.scrollWidth > metrics.viewportWidth + 1) throw new Error('Profile completion mobile overflow');
            if (metrics.formWidth < metrics.viewportWidth * 0.85 || metrics.firstInputWidth < metrics.viewportWidth * 0.70) throw new Error('Profile completion mobile lost useful width');
            return metrics;
          }" | tee "$OUT/profile/mobile-initial.metrics.log"
          playwright-cli snapshot --filename="$OUT/profile/mobile-initial.accessibility.yml"
          playwright-cli screenshot --full-page --filename="$OUT/profile/mobile-initial.png"
          playwright-cli click ".completion-submit"
          playwright-cli run-code "async (page) => {
            await page.waitForSelector('.tooltip-error', { state: 'visible' });
            const metrics = await page.evaluate(() => {
              const errors = Array.from(document.querySelectorAll('.tooltip-error')).filter((el) => el.getClientRects().length);
              const formRect = document.querySelector('.form-container')?.getBoundingClientRect();
              const overlaps = [];
              for (const error of errors) {
                const owner = error.closest('.form-field');
                const next = owner?.nextElementSibling;
                if (!next) continue;
                if (error.getBoundingClientRect().bottom > next.getBoundingClientRect().top + 1) overlaps.push(error.id);
              }
              return {
                viewportWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                formWidth: formRect?.width ?? 0,
                visibleErrors: errors.length,
                accessibleErrors: errors.filter((el) => el.getAttribute('role') === 'alert' && el.getAttribute('aria-live') === 'polite').length,
                outOfViewportErrors: errors.filter((el) => {
                  const rect = el.getBoundingClientRect();
                  return rect.left < -1 || rect.right > window.innerWidth + 1;
                }).map((el) => el.id),
                overlaps,
              };
            });
            console.log(JSON.stringify(metrics));
            if (metrics.scrollWidth > metrics.viewportWidth + 1) throw new Error('Profile completion mobile invalid overflow');
            if (metrics.formWidth < metrics.viewportWidth * 0.85) throw new Error('Profile completion mobile invalid card too narrow');
            if (metrics.visibleErrors !== 4 || metrics.accessibleErrors !== 4 || metrics.outOfViewportErrors.length || metrics.overlaps.length) throw new Error('Profile completion mobile invalid feedback regression');
            return metrics;
          }" | tee "$OUT/profile/mobile-invalid.metrics.log"
          playwright-cli snapshot --filename="$OUT/profile/mobile-invalid.accessibility.yml"
          playwright-cli screenshot --full-page --filename="$OUT/profile/mobile-invalid.png"

          playwright-cli resize 1440 1000
          playwright-cli run-code "async (page) => {
            await page.goto('$BASE/register/aceitar-termos');
            await page.waitForSelector('.terms-acceptance__card', { state: 'visible' });
            const metrics = await page.evaluate(() => ({
              viewportWidth: window.innerWidth,
              scrollWidth: document.documentElement.scrollWidth,
              links: document.querySelectorAll('.terms-acceptance__links a').length,
              checkboxVisible: !!document.querySelector('input[type=checkbox]')?.getClientRects().length,
              actions: document.querySelectorAll('.terms-acceptance__actions button').length,
            }));
            console.log(JSON.stringify(metrics));
            if (metrics.scrollWidth > metrics.viewportWidth + 1) throw new Error('Terms desktop overflow');
            if (metrics.links !== 2 || !metrics.checkboxVisible || metrics.actions !== 2) throw new Error('Terms desktop incomplete');
            return metrics;
          }" | tee "$OUT/terms/desktop-initial.metrics.log"
          playwright-cli snapshot --filename="$OUT/terms/desktop-initial.accessibility.yml"
          playwright-cli screenshot --full-page --filename="$OUT/terms/desktop-initial.png"
          playwright-cli click ".terms-acceptance__button--primary"
          playwright-cli run-code "async (page) => {
            await page.waitForSelector('#terms-confirmation-error.terms-acceptance__error', { state: 'visible' });
            const metrics = await page.evaluate(() => {
              const error = document.querySelector('#terms-confirmation-error.terms-acceptance__error');
              return {
                viewportWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                role: error?.getAttribute('role'),
                errorVisible: !!error?.getClientRects().length,
              };
            });
            console.log(JSON.stringify(metrics));
            if (metrics.scrollWidth > metrics.viewportWidth + 1 || !metrics.errorVisible || metrics.role !== 'alert') throw new Error('Terms desktop invalid feedback regression');
            return metrics;
          }" | tee "$OUT/terms/desktop-invalid.metrics.log"
          playwright-cli snapshot --filename="$OUT/terms/desktop-invalid.accessibility.yml"
          playwright-cli screenshot --full-page --filename="$OUT/terms/desktop-invalid.png"

          playwright-cli resize 390 844
          playwright-cli run-code "async (page) => {
            await page.goto('$BASE/register/aceitar-termos');
            await page.waitForSelector('.terms-acceptance__card', { state: 'visible' });
            const metrics = await page.evaluate(() => {
              const cardRect = document.querySelector('.terms-acceptance__card')?.getBoundingClientRect();
              const buttons = Array.from(document.querySelectorAll('.terms-acceptance__actions button'));
              return {
                viewportWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                cardWidth: cardRect?.width ?? 0,
                shortButtons: buttons.filter((el) => el.getBoundingClientRect().height < 44).map((el) => el.textContent?.trim()),
              };
            });
            console.log(JSON.stringify(metrics));
            if (metrics.scrollWidth > metrics.viewportWidth + 1) throw new Error('Terms mobile overflow');
            if (metrics.cardWidth < metrics.viewportWidth * 0.85 || metrics.shortButtons.length) throw new Error('Terms mobile lost useful width or touch size');
            return metrics;
          }" | tee "$OUT/terms/mobile-initial.metrics.log"
          playwright-cli snapshot --filename="$OUT/terms/mobile-initial.accessibility.yml"
          playwright-cli screenshot --full-page --filename="$OUT/terms/mobile-initial.png"
          playwright-cli click ".terms-acceptance__button--primary"
          playwright-cli run-code "async (page) => {
            await page.waitForSelector('#terms-confirmation-error.terms-acceptance__error', { state: 'visible' });
            const metrics = await page.evaluate(() => {
              const error = document.querySelector('#terms-confirmation-error.terms-acceptance__error');
              const rect = error?.getBoundingClientRect();
              return {
                viewportWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                role: error?.getAttribute('role'),
                escaped: !!rect && (rect.left < -1 || rect.right > window.innerWidth + 1),
              };
            });
            console.log(JSON.stringify(metrics));
            if (metrics.scrollWidth > metrics.viewportWidth + 1 || metrics.role !== 'alert' || metrics.escaped) throw new Error('Terms mobile invalid feedback regression');
            return metrics;
          }" | tee "$OUT/terms/mobile-invalid.metrics.log"
          playwright-cli snapshot --filename="$OUT/terms/mobile-invalid.accessibility.yml"
          playwright-cli screenshot --full-page --filename="$OUT/terms/mobile-invalid.png"

          # Compatibilidade: a URL anterior deve redirecionar sem exibir o formulário removido.
          playwright-cli resize 1440 1000
          playwright-cli run-code "async (page) => {
            await page.goto('$BASE/adulto/confirmar');
            await page.waitForURL((url) => !url.pathname.startsWith('/adulto/confirmar'), { timeout: 15000 });
            const metrics = await page.evaluate(() => ({
              viewportWidth: window.innerWidth,
              scrollWidth: document.documentElement.scrollWidth,
              finalPath: window.location.pathname,
              removedFormVisible: !!document.querySelector('.adult-consent__card')?.getClientRects().length,
            }));
            console.log(JSON.stringify(metrics));
            if (metrics.scrollWidth > metrics.viewportWidth + 1) throw new Error('Legacy redirect desktop overflow');
            if (metrics.finalPath.startsWith('/adulto/confirmar') || metrics.removedFormVisible) throw new Error('Legacy adult confirmation route is still active on desktop');
            return metrics;
          }" | tee "$OUT/adult/desktop-legacy-redirect.metrics.log"
          playwright-cli snapshot --filename="$OUT/adult/desktop-legacy-redirect.accessibility.yml"
          playwright-cli screenshot --full-page --filename="$OUT/adult/desktop-legacy-redirect.png"

          playwright-cli resize 390 844
          playwright-cli run-code "async (page) => {
            await page.goto('$BASE/adulto/confirmar');
            await page.waitForURL((url) => !url.pathname.startsWith('/adulto/confirmar'), { timeout: 15000 });
            const metrics = await page.evaluate(() => ({
              viewportWidth: window.innerWidth,
              scrollWidth: document.documentElement.scrollWidth,
              finalPath: window.location.pathname,
              removedFormVisible: !!document.querySelector('.adult-consent__card')?.getClientRects().length,
            }));
            console.log(JSON.stringify(metrics));
            if (metrics.scrollWidth > metrics.viewportWidth + 1) throw new Error('Legacy redirect mobile overflow');
            if (metrics.finalPath.startsWith('/adulto/confirmar') || metrics.removedFormVisible) throw new Error('Legacy adult confirmation route is still active on mobile');
            return metrics;
          }" | tee "$OUT/adult/mobile-legacy-redirect.metrics.log"
          playwright-cli snapshot --filename="$OUT/adult/mobile-legacy-redirect.accessibility.yml"
          playwright-cli screenshot --full-page --filename="$OUT/adult/mobile-legacy-redirect.png"

          playwright-cli console error > "$OUT/browser-console-errors.log" || true
          playwright-cli close

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: registration-visual-${{ matrix.configuration }}
          path: artifacts/${{ matrix.configuration }}/
          if-no-files-found: warn
          retention-days: 7
