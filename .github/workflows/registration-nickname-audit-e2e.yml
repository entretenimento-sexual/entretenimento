name: Registration Nickname Audit E2E

on:
  push:
    paths:
      - '.github/workflows/registration-nickname-audit-e2e.yml'
      - 'scripts/tests/nickname-cutover-readonly.e2e.mjs'
      - 'scripts/maintenance/nickname-scan-report.policy.mjs'
      - 'scripts/maintenance/audit-nickname-cutover-readonly.mjs'
      - 'scripts/maintenance/backfill-nickname-reservations-admin.mjs'
      - 'scripts/maintenance/nickname-cutover-inventory.policy.mjs'
      - 'scripts/maintenance/nickname-reservation-backfill.policy.mjs'
      - 'functions/src/registration/nickname-reservation.policy.ts'
      - 'functions/package.json'
      - 'functions/package-lock.json'
      - 'package.json'
      - 'package-lock.json'
      - 'firebase.media-e2e.json'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: registration-nickname-audit
  cancel-in-progress: true

jobs:
  read-only-scanners:
    name: Verify full scans on disposable demo Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci
      - name: Build Rules and canonical nickname normalization
        run: |
          npm run rules:build
          npm run rules:check
          npm run functions:build
      - name: Exercise JSON reports and exact boundary detection
        run: |
          node node_modules/firebase-tools/lib/bin/firebase.js emulators:exec \
            --config firebase.media-e2e.json \
            --only firestore \
            --project demo-nickname-audit \
            "node scripts/tests/nickname-cutover-readonly.e2e.mjs"
