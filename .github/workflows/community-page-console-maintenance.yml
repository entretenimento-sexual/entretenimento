name: Community page console maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/community-page-console-maintenance.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch page console parser and remove maintenance workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/community-preview-visual-validation.yml')
          text = path.read_text()
          old = '''          console_error_count=0
          for console_file in "${console_files[@]}"; do
            if ! grep -q '^Console: 0 errors,' "$console_file"; then
              echo "Erro inesperado de console ou resumo inválido em ${console_file}:" >&2
              cat "$console_file" >&2
              console_error_count=$((console_error_count + 1))
            fi
          done
'''
          new = '''          console_error_count=0
          for console_file in "${console_files[@]}"; do
            # Compatível com logs Playwright em [ERROR] e em error <...> colorizado.
            if grep -Eqi '(\\[ERROR\\]|error.*<)' "$console_file"; then
              echo "Erro inesperado de console em ${console_file}:" >&2
              cat "$console_file" >&2
              console_error_count=$((console_error_count + 1))
            fi
          done
'''
          if old not in text:
              raise SystemExit('page console parser anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git rm .github/workflows/community-page-console-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/community-preview-visual-validation.yml
          git commit -m 'test(community): normalize page visual console parsing'
          git push origin HEAD:main

      - name: Run current Community page visual validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run community-preview-visual-validation.yml --ref main
