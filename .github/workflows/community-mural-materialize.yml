name: Materialize Validated Mural Candidate

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/community-mural-materialize.yml'

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VALIDATED_RUN_ID: '33222732701'
      VALIDATED_ARTIFACT: 'community-mural-visual-33222732701'
      EXPECTED_BASE_SHA: '2322e882e1317a8d8d4cc49fedb48386c27ba3ad'
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify validated ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD

      - name: Download exact validated source candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/mural-validated
          mkdir -p /tmp/mural-validated
          gh run download "$VALIDATED_RUN_ID" \
            --repo '${{ github.repository }}' \
            --name "$VALIDATED_ARTIFACT" \
            --dir /tmp/mural-validated

          test -s /tmp/mural-validated/source/src/app/community/feed/community-feed.component.css
          test -s /tmp/mural-validated/source/src/app/community/feed/community-feed.interactions.css
          test -s /tmp/mural-validated/source/src/app/community/feed/community-feed.component.ts
          test -s /tmp/mural-validated/source/src/app/community/feed-comments/community-feed-comments.component.css

      - name: Materialize product files only
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/mural-validated/source/src/app/community/feed/community-feed.component.css src/app/community/feed/community-feed.component.css
          cp /tmp/mural-validated/source/src/app/community/feed/community-feed.interactions.css src/app/community/feed/community-feed.interactions.css
          cp /tmp/mural-validated/source/src/app/community/feed/community-feed.component.ts src/app/community/feed/community-feed.component.ts
          cp /tmp/mural-validated/source/src/app/community/feed-comments/community-feed-comments.component.css src/app/community/feed-comments/community-feed-comments.component.css

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/app/community/feed/community-feed.component.css \
            src/app/community/feed/community-feed.interactions.css \
            src/app/community/feed/community-feed.component.ts \
            src/app/community/feed-comments/community-feed-comments.component.css

          if git diff --cached --quiet; then
            echo 'Validated Mural candidate already materialized.'
            exit 0
          fi

          git commit -m 'fix(mural): enforce accessible responsive touch targets'
          git push origin HEAD:main
