name: One-time main-only branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-non-main-branches:
    runs-on: ubuntu-latest
    if: github.repository == 'entretenimento-sexual/entretenimento'
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPOSITORY}/branches?per_page=100" --jq '.[].name' |
          while IFS= read -r branch; do
            if [[ "${branch}" == "main" ]]; then
              continue
            fi
            echo "Deleting refs/heads/${branch}"
            gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${branch}"
          done
