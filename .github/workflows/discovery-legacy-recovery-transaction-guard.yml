name: Discovery Legacy Recovery Transaction Guard

on:
  push:
    branches: [main]
    paths:
      - 'scripts/maintenance/discovery-legacy-recovery-transaction.policy.mjs'
      - 'scripts/maintenance/discovery-legacy-owner-fence.policy.mjs'
      - 'scripts/maintenance/discovery-legacy-owner-fence-race.exercise.mjs'
      - 'scripts/tests/discovery-legacy-owner-fence.policy.test.mjs'
      - 'scripts/maintenance/account-legacy-recovery-purge-emulator.policy.mjs'
      - 'scripts/maintenance/rehearse-account-legacy-recovery-purge-synthetic.mjs'
      - 'scripts/tests/account-legacy-recovery-purge-emulator.policy.test.mjs'
      - 'functions/src/account_lifecycle/account-legacy-recovery-purge.policy.ts'
      - 'functions/src/account_lifecycle/account-data-deletion.firestore.ts'
      - 'scripts/maintenance/discovery-legacy-recovery-persistence.policy.mjs'
      - 'scripts/maintenance/discovery-legacy-recovery-governance.policy.mjs'
      - 'scripts/maintenance/discovery-legacy-approval-lifecycle.policy.mjs'
      - 'scripts/tests/discovery-legacy-approval-lifecycle.policy.test.mjs'
      - 'functions/src/discovery/legacy-recovery-admin-readonly.firestore.ts'
      - 'functions/src/discovery/legacy-recovery-admin-readonly.firestore.test.ts'
      - 'functions/src/discovery/legacy-recovery-review-authority-readonly.firestore.ts'
      - 'functions/src/discovery/legacy-recovery-review-authority-readonly.firestore.test.ts'
      - 'scripts/quality/check-production-orphans.mjs'
      - 'scripts/tests/discovery-legacy-recovery-backend-readonly.contract.test.mjs'
      - 'scripts/maintenance/rehearse-discovery-legacy-admin-synthetic.mjs'
      - 'scripts/tests/discovery-legacy-admin-emulator.contract.test.mjs'
      - 'firebase.legacy-governance-e2e.json'
      - 'firestore-rules/legacy_discovery_recovery_approvals.rules'
      - 'firestore-rules/tools-rules/firestore-rules-parts.mjs'
      - 'firestore-rules/tests/legacy-discovery-recovery-approvals.rules.spec.ts'
      - 'scripts/tests/discovery-legacy-recovery-governance.policy.test.mjs'
      - 'scripts/maintenance/discovery-legacy-recovery-rollback-runner.policy.mjs'
      - 'scripts/maintenance/rehearse-discovery-legacy-recovery-rollback.mjs'
      - 'scripts/maintenance/discovery-legacy-recovery-rehearsal.policy.mjs'
      - 'scripts/tests/discovery-legacy-recovery-transaction.policy.test.mjs'
      - 'scripts/tests/discovery-legacy-recovery-persistence.policy.test.mjs'
      - 'scripts/tests/discovery-legacy-recovery-rollback-runner.policy.test.mjs'
      - '.github/workflows/discovery-legacy-recovery-transaction-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovery-recovery-transaction-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reversible-contract:
    name: Isolated transaction/rollback contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify isolated-only write, idempotence, conflicts and rollback
        run: node --test scripts/tests/discovery-legacy-recovery-transaction.policy.test.mjs

      - name: Preserve B1 readonly policy regression
        run: node --test scripts/tests/discovery-legacy-recovery-rehearsal.policy.test.mjs

      - name: Validate isolated snapshot runner and fail-closed preflight
        run: node --test scripts/tests/discovery-legacy-recovery-rollback-runner.policy.test.mjs

      - name: Validate B2.2 persistence remains blocked pending authorization and retention
        run: node --test scripts/tests/discovery-legacy-recovery-persistence.policy.test.mjs

      - name: Verify synthetic-only account purge emulator preflight
        run: node --test scripts/tests/account-legacy-recovery-purge-emulator.policy.test.mjs

      - name: Verify transactional deletion fence and synthetic concurrency contracts
        run: node --test scripts/tests/discovery-legacy-owner-fence.policy.test.mjs

      - name: Syntax check synthetic race and purge runners
        run: |
          node --check scripts/maintenance/discovery-legacy-owner-fence-race.exercise.mjs
          node --check scripts/maintenance/rehearse-account-legacy-recovery-purge-synthetic.mjs

      - name: Validate B2.6 admin evidence and aggregate-only audit governance
        run: node --test scripts/tests/discovery-legacy-recovery-governance.policy.test.mjs

      - name: Guard B2.9.1 pure approval lifecycle and replay protections
        run: node --test scripts/tests/discovery-legacy-approval-lifecycle.policy.test.mjs

      - name: Guard B2.7 backend-only read and unexported entrypoint
        run: node --test scripts/tests/discovery-legacy-recovery-backend-readonly.contract.test.mjs

      - name: Guard B2.8 synthetic runner syntax
        run: node --check scripts/maintenance/rehearse-discovery-legacy-admin-synthetic.mjs

      - name: Guard B2.8 fail-closed contracts
        run: node --test scripts/tests/discovery-legacy-admin-emulator.contract.test.mjs

  real-emulator-e2e:
    name: B2.8 isolated Auth + Firestore (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Java 21 for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund

      - name: Build Firestore rules and internal reader
        run: |
          npm run rules:build
          npm --prefix functions run build

      - name: Guard B2.9.2a lifecycle-authority bridge (synthetic backend)
        working-directory: functions
        run: node --test lib/discovery/legacy-recovery-review-authority-readonly.firestore.test.js

      - name: B2.8 isolated preflight
        run: node scripts/maintenance/rehearse-discovery-legacy-admin-synthetic.mjs --preflight

      - name: B2.8 real Auth and Firestore synthetic E2E
        shell: bash
        env:
          GCLOUD_PROJECT: demo-entretenimento-legacy-governance
          FUNCTIONS_EMULATOR: 'true'
        run: node node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --project demo-entretenimento-legacy-governance --only auth,firestore --config firebase.legacy-governance-e2e.json "node scripts/maintenance/rehearse-discovery-legacy-admin-synthetic.mjs --execute"
