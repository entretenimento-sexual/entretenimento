name: Discovery Legacy Recovery Transaction Guard

on:
  push:
    branches: [main]
    paths:
      - 'scripts/maintenance/discovery-legacy-recovery-transaction.policy.mjs'
      - 'scripts/maintenance/discovery-legacy-owner-fence.policy.mjs'
      - 'scripts/maintenance/discovery-legacy-owner-fence-race.exercise.mjs'
      - 'scripts/tests/discovery-legacy-owner-fence.policy.test.mjs'
      - 'scripts/maintenance/account-legacy-recovery-purge-emulator.policy.mjs'
      - 'scripts/maintenance/rehearse-account-legacy-recovery-purge-synthetic.mjs'
      - 'scripts/tests/account-legacy-recovery-purge-emulator.policy.test.mjs'
      - 'functions/src/account_lifecycle/account-legacy-recovery-purge.policy.ts'
      - 'functions/src/account_lifecycle/account-data-deletion.firestore.ts'
      - 'scripts/maintenance/discovery-legacy-recovery-persistence.policy.mjs'
      - 'scripts/maintenance/discovery-legacy-recovery-governance.policy.mjs'
      - 'scripts/maintenance/discovery-legacy-approval-lifecycle.policy.mjs'
      - 'scripts/tests/discovery-legacy-approval-lifecycle.policy.test.mjs'
      - 'functions/src/discovery/legacy-recovery-admin-readonly.firestore.ts'
      - 'functions/src/discovery/legacy-recovery-admin-readonly.firestore.test.ts'
      - 'functions/src/discovery/legacy-recovery-review-authority-readonly.firestore.ts'
      - 'functions/src/discovery/legacy-recovery-review-authority-readonly.firestore.test.ts'
      - 'scripts/quality/check-production-orphans.mjs'
      - 'scripts/tests/discovery-legacy-recovery-backend-readonly.contract.test.mjs'
      - 'scripts/maintenance/rehearse-discovery-legacy-admin-synthetic.mjs'
      - 'scripts/maintenance/rehearse-discovery-legacy-review-authority-synthetic.mjs'
      - 'scripts/tests/discovery-legacy-review-authority-emulator.contract.test.mjs'
      - 'scripts/maintenance/rehearse-discovery-legacy-approval-transaction-synthetic.mjs'
      - 'scripts/tests/discovery-legacy-approval-transaction-emulator.contract.test.mjs'
      - 'scripts/maintenance/discovery-legacy-approval-audit-integrity.policy.mjs'
      - 'scripts/tests/discovery-legacy-approval-audit-integrity.policy.test.mjs'
      - 'scripts/maintenance/rehearse-discovery-legacy-approval-audit-atomic-synthetic.mjs'
      - 'scripts/tests/discovery-legacy-approval-audit-atomic-emulator.contract.test.mjs'
      - 'scripts/maintenance/discovery-legacy-approval-reconciliation.policy.mjs'
      - 'scripts/tests/discovery-legacy-approval-reconciliation.policy.test.mjs'
      - 'scripts/maintenance/rehearse-discovery-legacy-approval-reconciliation-synthetic.mjs'
      - 'scripts/tests/discovery-legacy-approval-reconciliation-emulator.contract.test.mjs'
      - 'scripts/maintenance/discovery-legacy-original-schema-reconciliation.policy.mjs'
      - 'scripts/tests/discovery-legacy-original-schema-reconciliation.policy.test.mjs'
      - 'scripts/tests/discovery-legacy-original-schema-integrated-emulator.contract.test.mjs'
      - 'scripts/tests/discovery-legacy-public-profiles-runtime.contract.test.mjs'
      - 'scripts/maintenance/discovery-legacy-sanitization-synthetic.policy.mjs'
      - 'scripts/maintenance/rehearse-discovery-legacy-sanitization-synthetic.mjs'
      - 'scripts/tests/discovery-legacy-sanitization-synthetic.policy.test.mjs'
      - 'scripts/tests/discovery-legacy-sanitization-synthetic.contract.test.mjs'
      - 'docs/operations/discovery-legacy-isolated-sanitization-rehearsal.md'
      - 'functions/src/discovery/legacy-public-profile-preservation.policy.ts'
      - 'functions/src/discovery/legacy-public-profile-preservation.policy.test.ts'
      - 'functions/src/discovery/sync-public-profile-discovery.handler.ts'
      - 'functions/src/discovery/sync-public-preference-projection.handler.ts'
      - 'functions/src/discovery/backfill-public-profile-discovery.handler.ts'
      - 'functions/src/discovery/backfill-public-profile-discovery.handler.test.ts'
      - 'functions/src/discovery/get-public-profiles-page.handler.ts'
      - 'functions/src/discovery/get-public-profiles-page.handler.test.ts'
      - 'docs/operations/discovery-legacy-public-profile-runtime-gate.md'
      - 'functions/src/community/community-member-search-index.policy.ts'
      - 'functions/src/community/community-member-search-index.policy.test.ts'
      - 'functions/src/community/get-profile-public-communities.handler.ts'
      - 'functions/src/community/get-profile-public-communities.contract.test.ts'
      - 'scripts/quality/audit-public-profile-readers.mjs'
      - 'scripts/tests/audit-public-profile-readers.test.mjs'
      - 'scripts/tests/issue-235-236-community-reader-gate.contract.test.mjs'
      - 'docs/operations/issue-235-236-community-reader-ui-qa.md'
      - 'functions/src/media/application/public-media-exposure.policy.ts'
      - 'functions/src/media/application/public-media-exposure.policy.test.ts'
      - 'functions/src/community/get-community-member-roster-page.handler.ts'
      - 'functions/src/community/get-community-member-roster-page.handler.test.ts'
      - 'functions/src/community/get-profile-official-communities.handler.ts'
      - 'functions/src/community/get-profile-official-communities.contract.test.ts'
      - 'functions/src/community/get-official-communities-for-target.handler.ts'
      - 'functions/src/community/get-official-communities-for-target.contract.test.ts'
      - 'scripts/tests/issue235236-public-reader-quarantine-stage2.contract.test.mjs'
      - 'docs/operations/issue235236-public-reader-quarantine-stage2.md'
      - 'functions/src/community/community-public-author.model.ts'
      - 'functions/src/community/community-public-author.model.test.ts'
      - 'scripts/tests/issue235236-community-feed-author-quarantine.contract.test.mjs'
      - 'docs/operations/issue235236-community-feed-author-quarantine-stage3.md'
      - 'docs/operations/discovery-legacy-issue-236-consolidated-audit.md'
      - 'scripts/tests/discovery-legacy-admin-emulator.contract.test.mjs'
      - 'firebase.legacy-governance-e2e.json'
      - 'firestore-rules/legacy_discovery_recovery_approvals.rules'
      - 'firestore-rules/tools-rules/firestore-rules-parts.mjs'
      - 'firestore-rules/tests/legacy-discovery-recovery-approvals.rules.spec.ts'
      - 'scripts/tests/discovery-legacy-recovery-governance.policy.test.mjs'
      - 'scripts/maintenance/discovery-legacy-recovery-rollback-runner.policy.mjs'
      - 'scripts/maintenance/rehearse-discovery-legacy-recovery-rollback.mjs'
      - 'scripts/maintenance/discovery-legacy-recovery-rehearsal.policy.mjs'
      - 'scripts/tests/discovery-legacy-recovery-transaction.policy.test.mjs'
      - 'scripts/tests/discovery-legacy-recovery-persistence.policy.test.mjs'
      - 'scripts/tests/discovery-legacy-recovery-rollback-runner.policy.test.mjs'
      - '.github/workflows/discovery-legacy-recovery-transaction-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovery-recovery-transaction-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reversible-contract:
    name: Isolated transaction/rollback contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify isolated-only write, idempotence, conflicts and rollback
        run: node --test scripts/tests/discovery-legacy-recovery-transaction.policy.test.mjs

      - name: Preserve B1 readonly policy regression
        run: node --test scripts/tests/discovery-legacy-recovery-rehearsal.policy.test.mjs

      - name: Validate isolated snapshot runner and fail-closed preflight
        run: node --test scripts/tests/discovery-legacy-recovery-rollback-runner.policy.test.mjs

      - name: Validate B2.2 persistence remains blocked pending authorization and retention
        run: node --test scripts/tests/discovery-legacy-recovery-persistence.policy.test.mjs

      - name: Verify synthetic-only account purge emulator preflight
        run: node --test scripts/tests/account-legacy-recovery-purge-emulator.policy.test.mjs

      - name: Verify transactional deletion fence and synthetic concurrency contracts
        run: node --test scripts/tests/discovery-legacy-owner-fence.policy.test.mjs

      - name: Syntax check synthetic race and purge runners
        run: |
          node --check scripts/maintenance/discovery-legacy-owner-fence-race.exercise.mjs
          node --check scripts/maintenance/rehearse-account-legacy-recovery-purge-synthetic.mjs

      - name: Validate B2.6 admin evidence and aggregate-only audit governance
        run: node --test scripts/tests/discovery-legacy-recovery-governance.policy.test.mjs

      - name: Guard B2.9.1 pure approval lifecycle and replay protections
        run: node --test scripts/tests/discovery-legacy-approval-lifecycle.policy.test.mjs

      - name: Guard B2.7 backend-only read and unexported entrypoint
        run: node --test scripts/tests/discovery-legacy-recovery-backend-readonly.contract.test.mjs

      - name: Guard B2.8 synthetic runner syntax
        run: node --check scripts/maintenance/rehearse-discovery-legacy-admin-synthetic.mjs

      - name: Guard B2.8 fail-closed contracts
        run: node --test scripts/tests/discovery-legacy-admin-emulator.contract.test.mjs

      - name: Guard B2.9.2b fail-closed runner and isolated CI wiring
        run: node --test scripts/tests/discovery-legacy-review-authority-emulator.contract.test.mjs

      - name: Guard B2.9.3a transaction runner contracts
        run: node --test scripts/tests/discovery-legacy-approval-transaction-emulator.contract.test.mjs

      - name: Guard B2.9.3b pure review audit integrity and retention proposal
        run: node --test scripts/tests/discovery-legacy-approval-audit-integrity.policy.test.mjs

      - name: Guard B2.9.3c atomic review audit transaction runner contracts
        run: node --test scripts/tests/discovery-legacy-approval-audit-atomic-emulator.contract.test.mjs

      - name: Guard B2.9.3d pure synthetic approval audit reconciliation
        run: node --test scripts/tests/discovery-legacy-approval-reconciliation.policy.test.mjs

      - name: Guard B2.9.3e emulator reconciliation runner contracts
        run: node --test scripts/tests/discovery-legacy-approval-reconciliation-emulator.contract.test.mjs

      - name: Guard consolidated original-schema pure reconciliation
        run: node --test scripts/tests/discovery-legacy-original-schema-reconciliation.policy.test.mjs

      - name: Guard consolidated original-schema integrated runner
        run: node --test scripts/tests/discovery-legacy-original-schema-integrated-emulator.contract.test.mjs

      - name: Guard Issue 236 runtime legacy-field hold and backend read exclusion
        run: node --test scripts/tests/discovery-legacy-public-profiles-runtime.contract.test.mjs

      - name: Guard Issue 235/236 community reader source contracts
        run: node --test scripts/tests/issue-235-236-community-reader-gate.contract.test.mjs scripts/tests/audit-public-profile-readers.test.mjs scripts/tests/issue235236-public-reader-quarantine-stage2.contract.test.mjs

      - name: Guard Issue 235/236 community feed author quarantine source contract
        run: node --test scripts/tests/issue235236-community-feed-author-quarantine.contract.test.mjs

      - name: Inventory explicit public profile source readers (read-only)
        run: node scripts/quality/audit-public-profile-readers.mjs --check-known

      - name: Guard B2.9.3g isolated sanitation policies and CI wiring
        run: node --test scripts/tests/discovery-legacy-sanitization-synthetic.policy.test.mjs scripts/tests/discovery-legacy-sanitization-synthetic.contract.test.mjs

  real-emulator-e2e:
    name: B2.8 isolated Auth + Firestore (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Java 21 for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund

      - name: Build Firestore rules and internal reader
        run: |
          npm run rules:build
          npm --prefix functions run build

      - name: Guard B2.9.2a lifecycle-authority bridge (synthetic backend)
        working-directory: functions
        run: node --test lib/discovery/legacy-recovery-review-authority-readonly.firestore.test.js

      - name: Guard Issue 236 real compiled policy and backend discovery read contracts
        working-directory: functions
        run: |
          node --test lib/discovery/legacy-public-profile-preservation.policy.test.js
          node --test lib/discovery/get-public-profiles-page.handler.test.js
          node --test lib/discovery/backfill-public-profile-discovery.handler.test.js

      - name: Guard Issue 235/236 compiled community public reader policies
        working-directory: functions
        run: |
          node --test lib/community/community-member-search-index.policy.test.js
          node --test lib/community/get-profile-public-communities.contract.test.js
          node --test lib/media/application/public-media-exposure.policy.test.js
          node --test lib/community/get-community-member-roster-page.handler.test.js
          node --test lib/community/get-profile-official-communities.contract.test.js
          node --test lib/community/get-official-communities-for-target.contract.test.js
          node --test lib/community/community-public-author.model.test.js

      - name: B2.8 isolated preflight
        run: node scripts/maintenance/rehearse-discovery-legacy-admin-synthetic.mjs --preflight

      - name: B2.8 real Auth and Firestore synthetic E2E
        shell: bash
        env:
          GCLOUD_PROJECT: demo-entretenimento-legacy-governance
          FUNCTIONS_EMULATOR: 'true'
        run: node node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --project demo-entretenimento-legacy-governance --only auth,firestore --config firebase.legacy-governance-e2e.json "node scripts/maintenance/rehearse-discovery-legacy-admin-synthetic.mjs --execute"

      - name: B2.9.2b isolated preflight
        run: node scripts/maintenance/rehearse-discovery-legacy-review-authority-synthetic.mjs --preflight

      - name: B2.9.2b real Auth + Firestore synthetic E2E
        shell: bash
        env:
          GCLOUD_PROJECT: demo-entretenimento-legacy-governance
          FUNCTIONS_EMULATOR: 'true'
        run: node node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --project demo-entretenimento-legacy-governance --only auth,firestore --config firebase.legacy-governance-e2e.json "node scripts/maintenance/rehearse-discovery-legacy-review-authority-synthetic.mjs --execute"

      - name: B2.9.3a isolated preflight
        run: node scripts/maintenance/rehearse-discovery-legacy-approval-transaction-synthetic.mjs --preflight

      - name: B2.9.3a real Firestore synthetic transaction E2E
        shell: bash
        env:
          GCLOUD_PROJECT: demo-entretenimento-legacy-governance
          FUNCTIONS_EMULATOR: 'true'
        run: node node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --project demo-entretenimento-legacy-governance --only auth,firestore --config firebase.legacy-governance-e2e.json "node scripts/maintenance/rehearse-discovery-legacy-approval-transaction-synthetic.mjs --execute"

      - name: B2.9.3c isolated preflight
        run: node scripts/maintenance/rehearse-discovery-legacy-approval-audit-atomic-synthetic.mjs --preflight

      - name: B2.9.3c real synthetic atomic audit E2E
        shell: bash
        env:
          GCLOUD_PROJECT: demo-entretenimento-legacy-governance
          FUNCTIONS_EMULATOR: 'true'
        run: node node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --project demo-entretenimento-legacy-governance --only auth,firestore --config firebase.legacy-governance-e2e.json "node scripts/maintenance/rehearse-discovery-legacy-approval-audit-atomic-synthetic.mjs --execute"

      - name: B2.9.3e isolated preflight
        run: node scripts/maintenance/rehearse-discovery-legacy-approval-reconciliation-synthetic.mjs --preflight

      - name: B2.9.3e real synthetic reconciliation E2E
        shell: bash
        env:
          GCLOUD_PROJECT: demo-entretenimento-legacy-governance
          FUNCTIONS_EMULATOR: 'true'
        run: node node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --project demo-entretenimento-legacy-governance --only auth,firestore --config firebase.legacy-governance-e2e.json "node scripts/maintenance/rehearse-discovery-legacy-approval-reconciliation-synthetic.mjs --execute"

      - name: B2.9.3f original-schema reconciliation preflight
        run: node scripts/maintenance/rehearse-discovery-legacy-approval-audit-atomic-synthetic.mjs --preflight

      - name: B2.9.3f original-schema reconciliation E2E
        shell: bash
        env:
          GCLOUD_PROJECT: demo-entretenimento-legacy-governance
          FUNCTIONS_EMULATOR: 'true'
        run: node node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --project demo-entretenimento-legacy-governance --only auth,firestore --config firebase.legacy-governance-e2e.json "node scripts/maintenance/rehearse-discovery-legacy-approval-audit-atomic-synthetic.mjs --integrated-reconciliation"

      - name: B2.9.3g synthetic targeted sanitation isolated preflight
        run: node scripts/maintenance/rehearse-discovery-legacy-sanitization-synthetic.mjs --preflight

      - name: B2.9.3g isolated preservation sanitize and rollback E2E
        shell: bash
        env:
          GCLOUD_PROJECT: demo-entretenimento-legacy-governance
          FUNCTIONS_EMULATOR: 'true'
        run: node node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --project demo-entretenimento-legacy-governance --only auth,firestore --config firebase.legacy-governance-e2e.json "node scripts/maintenance/rehearse-discovery-legacy-sanitization-synthetic.mjs --exercise"
