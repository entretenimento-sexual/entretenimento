name: Media Draft Storage Rules

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-draft-storage-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reservation-rules:
    name: Reserved upload rules
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Firestore Rules
        run: npm run rules:build

      - name: Validate private media reservations
        shell: bash
        run: |
          npx firebase emulators:exec \
            --config firebase.media-e2e.json \
            --only firestore,storage \
            --project demo-entretenimento-media-draft-rules \
            "node scripts/tests/private-media-draft-storage-rules.e2e.mjs"
