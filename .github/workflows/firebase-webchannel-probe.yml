name: Firebase WebChannel Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firebase-webchannel-probe.yml'
      - 'scripts/tests/firebase-webchannel-probe*'
      - 'firebase.webchannel-probe.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked application SDK
        run: npm ci
      - name: Install isolated browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/webchannel-playwright" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/webchannel-playwright/node_modules/.bin/playwright" install --with-deps ${{ matrix.engine }}
      - name: Run SDK against disposable emulators
        shell: bash
        run: |
          set -euo pipefail
          export CHAT_BROWSER_PLAYWRIGHT="$RUNNER_TEMP/webchannel-playwright/node_modules/playwright/index.mjs"
          export GCLOUD_PROJECT=demo-firebase-webchannel-probe
          node --check scripts/tests/firebase-webchannel-probe-client.mjs
          node --check scripts/tests/firebase-webchannel-probe.mjs
          npx --no-install firebase emulators:exec --config firebase.webchannel-probe.json --only auth,firestore --project demo-firebase-webchannel-probe "node scripts/tests/firebase-webchannel-probe.mjs ${{ matrix.engine }}"
      - name: Upload isolated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-webchannel-probe-${{ matrix.engine }}
          path: artifacts/firebase-webchannel-probe/
          if-no-files-found: error
