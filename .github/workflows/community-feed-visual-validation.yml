name: Community Mural Visual Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/app/community/feed/**'
      - 'src/app/community/feed-comments/**'
      - 'src/app/community/data-access/community-feed*.ts'
      - 'src/styles/**'
      - '.github/visual-harness/community-mural-visual.app-component.ts'
      - '.github/workflows/community-feed-visual-validation.yml'

permissions:
  contents: read

concurrency:
  group: community-mural-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Mural desktop and mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate production-safe build
        run: npm run build:safe

      - name: Prepare isolated Mural visual harness
        shell: bash
        run: |
          set -euo pipefail
          cp .github/visual-harness/community-mural-visual.app-component.ts src/app/app.component.ts

          cat > src/main.ts <<'TS'
          import 'zone.js';
          import { platformBrowserDynamic } from '@angular/platform-browser-dynamic';
          import { AppModule } from './app/app.module';

          platformBrowserDynamic()
            .bootstrapModule(AppModule)
            .catch((error: unknown) => console.error(error));
          TS

          cat > src/app/app.module.ts <<'TS'
          import { NgModule } from '@angular/core';
          import { BrowserModule } from '@angular/platform-browser';
          import { AppComponent } from './app.component';
          import { CommunityFeedComponent } from './community/feed/community-feed.component';

          @NgModule({
            declarations: [AppComponent],
            imports: [BrowserModule, CommunityFeedComponent],
            bootstrap: [AppComponent],
          })
          export class AppModule {}
          TS

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @playwright/cli@0.1.17
          playwright-cli install-browser --with-deps

      - name: Start isolated Mural harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          nohup npx ng serve \
            --configuration=dev-emu \
            --host=127.0.0.1 \
            --port=4200 \
            > artifacts/ng-serve.log 2>&1 &
          echo $! > artifacts/ng-serve.pid

          for attempt in $(seq 1 180); do
            if curl --fail --silent --show-error 'http://127.0.0.1:4200/' >/dev/null; then
              echo "Mural visual harness ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done

          cat artifacts/ng-serve.log >&2 || true
          exit 1

      - name: Validate and capture desktop and mobile
        shell: bash
        env:
          PLAYWRIGHT_CLI_SESSION: community-mural
        run: |
          set -euo pipefail
          OUT='artifacts/community-mural'
          mkdir -p "$OUT/desktop" "$OUT/mobile"

          check_log() {
            local file="$1"
            if grep -q '^### Error' "$file"; then
              cat "$file" >&2
              exit 1
            fi
          }

          run_checked() {
            local file="$1"
            local code="$2"
            playwright-cli run-code "$code" | tee "$file"
            check_log "$file"
          }

          playwright-cli open 'http://127.0.0.1:4200/'
          playwright-cli resize 1440 1100

          run_checked "$OUT/desktop/metrics.log" "async (page) => {
            await page.waitForSelector('.community-post', { state: 'visible' });
            const metrics = await page.evaluate(() => {
              const visible = (element) => {
                const style = getComputedStyle(element);
                return style.display !== 'none' && style.visibility !== 'hidden';
              };
              const size = (element) => {
                const rect = element.getBoundingClientRect();
                return Math.min(rect.width, rect.height);
              };
              const actions = Array.from(document.querySelectorAll('.community-post__action')).filter(visible).map(size);
              const composer = Array.from(document.querySelectorAll('.community-feed__composer-tool, .community-feed__send')).filter(visible).map(size);
              const locationMapLinks = Array.from(document.querySelectorAll('.community-post__location-map-link')).filter(visible);
              const buttons = Array.from(document.querySelectorAll('button')).filter(visible);
              return {
                viewportWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                postCount: document.querySelectorAll('.community-post').length,
                locationCount: document.querySelectorAll('.community-post__location').length,
                locationMapLinkCount: locationMapLinks.length,
                legacyLocationLinkCount: document.querySelectorAll('.community-post__location-link').length,
                minLocationMapTarget: locationMapLinks.length ? Math.min(...locationMapLinks.map(size)) : 0,
                imageCount: document.querySelectorAll('.community-post__media img').length,
                minActionTarget: Math.min(...actions),
                minComposerTarget: Math.min(...composer),
                unnamedButtons: buttons.filter((button) => !(
                  button.getAttribute('aria-label')
                  || button.getAttribute('title')
                  || button.textContent
                  || ''
                ).trim()).length,
              };
            });
            if (
              metrics.scrollWidth > metrics.viewportWidth + 1
              || metrics.postCount !== 3
              || metrics.locationCount !== 1
              || metrics.locationMapLinkCount !== 1
              || metrics.legacyLocationLinkCount !== 0
              || metrics.minLocationMapTarget < 44
              || metrics.imageCount !== 1
              || metrics.minActionTarget < 44
              || metrics.minComposerTarget < 44
              || metrics.unnamedButtons > 0
            ) {
              throw new Error('Desktop Mural validation failed: ' + JSON.stringify(metrics));
            }
            return metrics;
          }"

          playwright-cli snapshot --filename="$OUT/desktop/accessibility.yml"
          playwright-cli screenshot --filename="$OUT/desktop/viewport.png"
          playwright-cli screenshot --full-page --filename="$OUT/desktop/full-page.png"

          run_checked "$OUT/desktop/reply.metrics.log" "async (page) => {
            const reply = page.getByRole('button', { name: 'Responder à publicação de Ana' });
            await reply.click();
            await page.waitForSelector('.feed-comments', { state: 'visible' });
            const expanded = await reply.getAttribute('aria-expanded');
            const comments = await page.locator('.feed-comment').count();
            if (expanded !== 'true' || comments !== 2) {
              throw new Error('Desktop conversation validation failed: ' + JSON.stringify({ expanded, comments }));
            }
            return { expanded, comments };
          }"
          playwright-cli screenshot --full-page --filename="$OUT/desktop/reply-open.png"

          run_checked "$OUT/desktop/location-composer.metrics.log" "async (page) => {
            await page.getByRole('button', { name: 'Fechar conversa' }).click();
            await page.locator('.community-feed__attachment-menu summary').click();
            await page.getByRole('button', { name: 'Localização' }).click();
            await page.waitForSelector('.community-feed__location-preview', { state: 'visible' });
            const preview = (await page.locator('.community-feed__location-preview').innerText()).trim();
            const removeRect = await page.getByRole('button', { name: 'Remover localização selecionada' }).boundingBox();
            const minRemoveTarget = removeRect ? Math.min(removeRect.width, removeRect.height) : 0;
            const scrollWidth = await page.evaluate(() => document.documentElement.scrollWidth);
            if (
              !preview.includes('Precisão estimada: ±18 m')
              || scrollWidth > 1441
              || minRemoveTarget < 44
            ) {
              throw new Error('Desktop location validation failed: ' + JSON.stringify({ preview, scrollWidth, minRemoveTarget }));
            }
            return { preview, scrollWidth, minRemoveTarget };
          }"
          playwright-cli screenshot --filename="$OUT/desktop/location-composer.png"

          playwright-cli goto 'http://127.0.0.1:4200/'
          playwright-cli resize 390 844

          run_checked "$OUT/mobile/metrics.log" "async (page) => {
            await page.waitForSelector('.community-post', { state: 'visible' });
            const metrics = await page.evaluate(() => {
              const size = (element) => {
                const rect = element.getBoundingClientRect();
                return Math.min(rect.width, rect.height);
              };
              const posts = Array.from(document.querySelectorAll('.community-post')).map((element) => element.getBoundingClientRect());
              const actions = Array.from(document.querySelectorAll('.community-post__action')).map(size);
              const composer = Array.from(document.querySelectorAll('.community-feed__composer-tool, .community-feed__send')).map(size);
              const references = Array.from(document.querySelectorAll('.community-post__reply-context.is-navigable')).map((element) => element.getBoundingClientRect().height);
              const locationMapLinks = Array.from(document.querySelectorAll('.community-post__location-map-link'));
              return {
                viewportWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                widestPost: Math.max(...posts.map((rect) => rect.width)),
                minActionTarget: Math.min(...actions),
                minComposerTarget: Math.min(...composer),
                minReferenceHeight: references.length ? Math.min(...references) : 44,
                locationMapLinkCount: locationMapLinks.length,
                minLocationMapTarget: locationMapLinks.length ? Math.min(...locationMapLinks.map(size)) : 0,
              };
            });
            if (
              metrics.scrollWidth > metrics.viewportWidth + 1
              || metrics.widestPost > metrics.viewportWidth + 1
              || metrics.minActionTarget < 44
              || metrics.minComposerTarget < 44
              || metrics.minReferenceHeight < 44
              || metrics.locationMapLinkCount !== 1
              || metrics.minLocationMapTarget < 44
            ) {
              throw new Error('Mobile Mural validation failed: ' + JSON.stringify(metrics));
            }
            return metrics;
          }"

          playwright-cli snapshot --filename="$OUT/mobile/accessibility.yml"
          playwright-cli screenshot --filename="$OUT/mobile/viewport.png"
          playwright-cli screenshot --full-page --filename="$OUT/mobile/full-page.png"

          run_checked "$OUT/mobile/reply.metrics.log" "async (page) => {
            const reply = page.getByRole('button', { name: 'Responder à publicação de Ana' });
            await reply.click();
            await page.waitForSelector('.feed-comments', { state: 'visible' });
            const metrics = await page.evaluate(() => {
              const root = document.querySelector('.feed-comments');
              const visible = (element) => {
                const style = getComputedStyle(element);
                return style.display !== 'none' && style.visibility !== 'hidden';
              };
              const targets = root
                ? Array.from(root.querySelectorAll('button, .feed-comment__quote')).filter(visible)
                : [];
              const sizes = targets.map((element) => {
                const rect = element.getBoundingClientRect();
                return Math.min(rect.width, rect.height);
              });
              const rect = root?.getBoundingClientRect();
              return {
                viewportWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                conversationWidth: rect?.width ?? 0,
                targetCount: targets.length,
                minConversationTarget: sizes.length ? Math.min(...sizes) : 0,
              };
            });
            if (
              metrics.scrollWidth > metrics.viewportWidth + 1
              || metrics.conversationWidth > metrics.viewportWidth + 1
              || metrics.targetCount < 4
              || metrics.minConversationTarget < 44
            ) {
              throw new Error('Mobile conversation validation failed: ' + JSON.stringify(metrics));
            }
            return metrics;
          }"
          playwright-cli screenshot --full-page --filename="$OUT/mobile/reply-open.png"

          run_checked "$OUT/mobile/location-composer.metrics.log" "async (page) => {
            await page.getByRole('button', { name: 'Fechar conversa' }).click();
            await page.locator('.community-feed__attachment-menu summary').click();
            await page.getByRole('button', { name: 'Localização' }).click();
            await page.waitForSelector('.community-feed__location-preview', { state: 'visible' });
            const preview = (await page.locator('.community-feed__location-preview').innerText()).trim();
            const removeRect = await page.getByRole('button', { name: 'Remover localização selecionada' }).boundingBox();
            const metrics = await page.evaluate(() => ({
              viewportWidth: window.innerWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }));
            const result = {
              ...metrics,
              preview,
              minRemoveTarget: removeRect ? Math.min(removeRect.width, removeRect.height) : 0,
            };
            if (
              !result.preview.includes('Precisão estimada: ±18 m')
              || result.scrollWidth > result.viewportWidth + 1
              || result.minRemoveTarget < 44
            ) {
              throw new Error('Mobile location validation failed: ' + JSON.stringify(result));
            }
            return result;
          }"
          playwright-cli screenshot --filename="$OUT/mobile/location-composer.png"

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: community-mural-visual-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
