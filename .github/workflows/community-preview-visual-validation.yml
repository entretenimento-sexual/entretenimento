name: Community Page Visual Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/app/community/preview/**'
      - 'src/app/community/feed/**'
      - 'src/app/community/feed-comments/**'
      - 'src/app/community/membership-management/**'
      - 'src/app/community/member-roster-management/**'
      - 'src/app/community/ownership-management/**'
      - 'src/app/community/community-settings/**'
      - 'src/app/community/data-access/community-preview*.ts'
      - 'src/app/community/data-access/community-feed*.ts'
      - 'src/app/community/presentation/**'
      - 'src/styles/**'
      - '.github/visual-harness/community-preview-visual.app-component.ts'
      - '.github/scripts/community-preview-visual-validation.sh'
      - '.github/workflows/community-preview-visual-validation.yml'

permissions:
  contents: read

concurrency:
  group: community-page-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Community page desktop, mobile and management
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # O Quality Gate executa a validação completa em paralelo. Este workflow
      # mantém o ciclo visual curto e delega as asserções reproduzíveis ao script
      # versionado em .github/scripts/.
      - name: Restore visual node_modules cache
        id: visual-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: community-visual-node22-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies when cache is cold
        if: steps.visual-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Prepare real Community page visual harness
        shell: bash
        run: |
          set -euo pipefail
          cp .github/visual-harness/community-preview-visual.app-component.ts src/app/app.component.ts

          cat > src/main.ts <<'TS'
          import 'zone.js';
          import { platformBrowserDynamic } from '@angular/platform-browser-dynamic';
          import { AppModule } from './app/app.module';

          platformBrowserDynamic()
            .bootstrapModule(AppModule)
            .catch((error: unknown) => console.error(error));
          TS

          cat > src/app/app.module.ts <<'TS'
          import { NgModule } from '@angular/core';
          import { BrowserModule } from '@angular/platform-browser';
          import { RouterModule } from '@angular/router';
          import { NEVER, of } from 'rxjs';
          import { AppComponent } from './app.component';
          import { CommunityHighlightRepository } from './community/data-access/community-highlight.repository';
          import { CommunityPreviewPageComponent } from './community/preview/community-preview-page.component';

          const visualCommunityHighlightRepository = {
            get$: ({ communityId }: { communityId: string }) => of({
              communityId,
              highlight: null,
              canManage: false,
              generatedAt: Date.now(),
            }),
            manage$: () => NEVER,
          };

          @NgModule({
            declarations: [AppComponent],
            imports: [
              BrowserModule,
              RouterModule.forRoot([]),
              CommunityPreviewPageComponent,
            ],
            providers: [
              {
                provide: CommunityHighlightRepository,
                useValue: visualCommunityHighlightRepository,
              },
            ],
            bootstrap: [AppComponent],
          })
          export class AppModule {}
          TS

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @playwright/cli@0.1.17
          playwright-cli install-browser --with-deps

      - name: Start current Community template with HMR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          nohup npx ng serve \
            --configuration=dev-emu \
            --hmr \
            --host=127.0.0.1 \
            --port=4200 \
            > artifacts/ng-serve.log 2>&1 &
          echo $! > artifacts/ng-serve.pid

          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error 'http://127.0.0.1:4200/' >/dev/null; then
              echo "Current Community template ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done

          cat artifacts/ng-serve.log >&2 || true
          exit 1

      - name: Capture current Community page desktop and mobile
        id: capture
        shell: bash
        env:
          PLAYWRIGHT_CLI_SESSION: community-page
        run: .github/scripts/community-preview-visual-validation.sh

      - name: Collect and assert browser console
        if: always()
        shell: bash
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/community-page/browser-console

          while IFS= read -r console_file; do
            cp "$console_file" "artifacts/community-page/browser-console/$(basename "$console_file")"
          done < <(find .playwright-cli -type f -name 'console-*.log' -print 2>/dev/null || true)

          shopt -s nullglob
          console_files=(artifacts/community-page/browser-console/console-*.log)
          if [[ "$CAPTURE_OUTCOME" == 'success' && ${#console_files[@]} -eq 0 ]]; then
            echo 'A captura visual terminou sem produzir logs de console do navegador.' >&2
            exit 1
          fi

          console_error_count=0
          for console_file in "${console_files[@]}"; do
            if grep -q '\[ERROR\]' "$console_file"; then
              echo "Erro inesperado de console em ${console_file}:" >&2
              cat "$console_file" >&2
              console_error_count=$((console_error_count + 1))
            fi
          done

          if (( console_error_count > 0 )); then
            echo "A validação visual encontrou erros de console em ${console_error_count} sessão(ões)." >&2
            exit 1
          fi

      - name: Upload current Community page visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: community-page-visual-${{ github.run_id }}
          path: artifacts/community-page
          if-no-files-found: error
          retention-days: 14
