name: Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NODE_VERSION: '22'

jobs:
  validate:
    name: Canonical quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Prepare logs
        run: mkdir -p logs

      - name: Install application dependencies
        id: app_install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee logs/app-install.log

      - name: Install Functions dependencies
        id: functions_install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm --prefix functions ci 2>&1 | tee logs/functions-install.log

      - name: Validate firestore.indexes.json
        id: firestore_indexes
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node <<'NODE' 2>&1 | tee logs/firestore-indexes.log
          const fs = require('node:fs');

          const filePath = 'firestore.indexes.json';
          const document = JSON.parse(fs.readFileSync(filePath, 'utf8'));

          if (!Array.isArray(document.indexes)) {
            throw new Error('firestore.indexes.json precisa conter o array "indexes".');
          }

          if (!Array.isArray(document.fieldOverrides)) {
            throw new Error(
              'firestore.indexes.json precisa conter o array "fieldOverrides".'
            );
          }

          for (const [indexPosition, indexDefinition] of document.indexes.entries()) {
            if (
              typeof indexDefinition.collectionGroup !== 'string' ||
              indexDefinition.collectionGroup.trim().length === 0
            ) {
              throw new Error(
                `Índice ${indexPosition} sem "collectionGroup" válido.`
              );
            }

            if (
              indexDefinition.queryScope !== 'COLLECTION' &&
              indexDefinition.queryScope !== 'COLLECTION_GROUP'
            ) {
              throw new Error(
                `Índice ${indexPosition} com "queryScope" inválido.`
              );
            }

            if (
              !Array.isArray(indexDefinition.fields) ||
              indexDefinition.fields.length === 0
            ) {
              throw new Error(`Índice ${indexPosition} sem campos.`);
            }
          }

          console.log(
            `firestore.indexes.json válido: ${document.indexes.length} índices e ${document.fieldOverrides.length} sobrescritas.`
          );
          NODE

      - name: Classify application dependency audit
        id: app_audit
        if: steps.app_install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          npm audit --json > logs/app-audit-all.json 2> logs/app-audit-all.err || true
          npm audit --omit=dev --json > logs/app-audit-prod.json 2> logs/app-audit-prod.err || true

          echo '=== All dependencies ==='
          node scripts/quality/classify-root-dependency-audit.mjs \
            --audit logs/app-audit-all.json \
            --lock package-lock.json \
            2>&1 | tee logs/app-audit-all-classified.log

          echo '=== Production dependencies ==='
          node scripts/quality/classify-root-dependency-audit.mjs \
            --audit logs/app-audit-prod.json \
            --lock package-lock.json \
            --fail-on moderate \
            2>&1 | tee logs/app-audit-prod-classified.log

      - name: Audit Functions production dependencies
        id: functions_audit
        if: steps.functions_install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if npm --prefix functions audit --omit=dev --audit-level=moderate \
            2>&1 | tee logs/functions-audit-prod.log; then
            exit 0
          fi

          if ! grep -Eq \
            'audit endpoint returned an error|400 Bad Request|Invalid package tree' \
            logs/functions-audit-prod.log; then
            exit 1
          fi

          echo 'npm audit registry fallback: querying the bulk advisory endpoint.'
          node <<'NODE' 2>&1 | tee -a logs/functions-audit-prod.log
          const fs = require('node:fs');

          async function main() {
            const lock = JSON.parse(
              fs.readFileSync('functions/package-lock.json', 'utf8')
            );
            const payload = {};

            for (const [location, meta] of Object.entries(lock.packages ?? {})) {
              if (!location || meta?.dev === true || !meta?.version) continue;

              const match = location.match(
                /(?:^|\/)node_modules\/((?:@[^/]+\/)?[^/]+)$/
              );
              if (!match) continue;

              const name = match[1];
              payload[name] ??= [];
              if (!payload[name].includes(meta.version)) {
                payload[name].push(meta.version);
              }
            }

            const response = await fetch(
              'https://registry.npmjs.org/-/npm/v1/security/advisories/bulk',
              {
                method: 'POST',
                headers: {
                  accept: 'application/json',
                  'content-type': 'application/json',
                },
                body: JSON.stringify(payload),
              }
            );

            if (!response.ok) {
              throw new Error(
                `Bulk advisory endpoint failed with HTTP ${response.status}`
              );
            }

            const advisories = await response.json();
            const blockingSeverities = new Set(['moderate', 'high', 'critical']);
            let blockingCount = 0;

            for (const [name, entries] of Object.entries(advisories ?? {})) {
              for (const advisory of entries ?? []) {
                const severity = String(advisory?.severity ?? '').toLowerCase();
                console.log(JSON.stringify({
                  name,
                  severity,
                  title: advisory?.title ?? null,
                  url: advisory?.url ?? null,
                  vulnerableVersions: advisory?.vulnerable_versions ?? null,
                }));
                if (blockingSeverities.has(severity)) blockingCount += 1;
              }
            }

            if (blockingCount > 0) {
              console.error(
                `Functions production audit found ${blockingCount} blocking advisory(s).`
              );
              process.exit(1);
            }

            console.log(
              'Functions production bulk advisory audit: no moderate+ findings.'
            );
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Report Functions development dependency audit
        if: steps.functions_install.outcome == 'success'
        shell: bash
        run: |
          npm --prefix functions audit --json \
            > logs/functions-audit-all.json 2> logs/functions-audit-all.err || true
          node <<'NODE'
          const fs = require('node:fs');
          let report;
          try {
            report = JSON.parse(
              fs.readFileSync('logs/functions-audit-all.json', 'utf8')
            );
          } catch {
            console.log('Functions all-dependencies audit unavailable from registry.');
            process.exit(0);
          }
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log(
            'Functions all-dependencies audit:',
            JSON.stringify(counts)
          );
          for (const vulnerability of Object.values(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name: vulnerability.name,
              severity: vulnerability.severity,
              isDirect: vulnerability.isDirect,
              via: (vulnerability.via ?? []).map((entry) =>
                typeof entry === 'string' ? entry : entry.name
              ),
              fixAvailable: vulnerability.fixAvailable,
            }));
          }
          NODE

      - name: Lint Functions
        id: functions_lint
        if: steps.functions_install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm --prefix functions run lint 2>&1 | tee logs/functions-lint.log

      - name: Build and test Functions
        id: functions_test
        if: steps.functions_install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm --prefix functions run test 2>&1 | tee logs/functions-test.log

      - name: Verify compiled Functions exports
        id: functions_exports
        if: steps.functions_install.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GCLOUD_PROJECT: demo-entretenimento-functions-ci
          GCP_PROJECT: demo-entretenimento-functions-ci
          FIREBASE_CONFIG: >-
            {"projectId":"demo-entretenimento-functions-ci","storageBucket":"demo-entretenimento-functions-ci.appspot.com"}
        run: |
          set -o pipefail
          node scripts/quality/check-functions-exports.mjs \
            2>&1 | tee logs/functions-exports.log

      - name: Run Angular test suite
        id: angular_tests
        if: steps.app_install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:ci 2>&1 | tee logs/angular-tests.log

      - name: Run Angular safe build
        id: angular_build
        if: steps.app_install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build:safe 2>&1 | tee logs/angular-build.log

      - name: Run Firestore Rules tests
        id: firestore_rules
        if: steps.app_install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee logs/firestore-rules-tests.log

      - name: Resolve aggregate result
        id: aggregate
        if: always()
        shell: bash
        env:
          APP_INSTALL: ${{ steps.app_install.outcome }}
          FUNCTIONS_INSTALL: ${{ steps.functions_install.outcome }}
          FIRESTORE_INDEXES: ${{ steps.firestore_indexes.outcome }}
          APP_AUDIT: ${{ steps.app_audit.outcome }}
          FUNCTIONS_AUDIT: ${{ steps.functions_audit.outcome }}
          FUNCTIONS_LINT: ${{ steps.functions_lint.outcome }}
          FUNCTIONS_TEST: ${{ steps.functions_test.outcome }}
          FUNCTIONS_EXPORTS: ${{ steps.functions_exports.outcome }}
          ANGULAR_TESTS: ${{ steps.angular_tests.outcome }}
          ANGULAR_BUILD: ${{ steps.angular_build.outcome }}
          FIRESTORE_RULES: ${{ steps.firestore_rules.outcome }}
        run: |
          state='success'
          description='Todos os checks de qualidade passaram.'

          declare -a checks=(
            "app_install:$APP_INSTALL"
            "functions_install:$FUNCTIONS_INSTALL"
            "firestore_indexes:$FIRESTORE_INDEXES"
            "app_audit:$APP_AUDIT"
            "functions_audit:$FUNCTIONS_AUDIT"
            "functions_lint:$FUNCTIONS_LINT"
            "functions_test:$FUNCTIONS_TEST"
            "functions_exports:$FUNCTIONS_EXPORTS"
            "angular_tests:$ANGULAR_TESTS"
            "angular_build:$ANGULAR_BUILD"
            "firestore_rules:$FIRESTORE_RULES"
          )

          for check in "${checks[@]}"; do
            name="${check%%:*}"
            result="${check#*:}"
            echo "${name}=${result}"
            if [[ "$result" != 'success' ]]; then
              state='failure'
              description="Quality Gate falhou em ${name} (${result})."
              break
            fi
          done

          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "description=$description" >> "$GITHUB_OUTPUT"

      - name: Publish validation summary
        if: always()
        shell: bash
        env:
          APP_INSTALL: ${{ steps.app_install.outcome }}
          FUNCTIONS_INSTALL: ${{ steps.functions_install.outcome }}
          FIRESTORE_INDEXES: ${{ steps.firestore_indexes.outcome }}
          APP_AUDIT: ${{ steps.app_audit.outcome }}
          FUNCTIONS_AUDIT: ${{ steps.functions_audit.outcome }}
          FUNCTIONS_LINT: ${{ steps.functions_lint.outcome }}
          FUNCTIONS_TEST: ${{ steps.functions_test.outcome }}
          FUNCTIONS_EXPORTS: ${{ steps.functions_exports.outcome }}
          ANGULAR_TESTS: ${{ steps.angular_tests.outcome }}
          ANGULAR_BUILD: ${{ steps.angular_build.outcome }}
          FIRESTORE_RULES: ${{ steps.firestore_rules.outcome }}
        run: |
          {
            echo '## Canonical Quality Gate'
            echo
            echo '| Etapa | Resultado |'
            echo '| --- | --- |'
            echo "| npm ci | $APP_INSTALL |"
            echo "| functions npm ci | $FUNCTIONS_INSTALL |"
            echo "| Firestore indexes | $FIRESTORE_INDEXES |"
            echo "| Application audit | $APP_AUDIT |"
            echo "| Functions production audit | $FUNCTIONS_AUDIT |"
            echo "| Functions lint | $FUNCTIONS_LINT |"
            echo "| Functions build/tests | $FUNCTIONS_TEST |"
            echo "| Functions exports | $FUNCTIONS_EXPORTS |"
            echo "| Angular tests | $ANGULAR_TESTS |"
            echo "| Angular safe build | $ANGULAR_BUILD |"
            echo "| Firestore Rules tests | $FIRESTORE_RULES |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish aggregate commit status
        if: >-
          always() &&
          steps.aggregate.outcome == 'success' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.aggregate.outputs.state }}
          DESCRIPTION: ${{ steps.aggregate.outputs.description }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -nc \
            --arg state "$STATE" \
            --arg context 'Quality Gate / aggregate' \
            --arg description "$DESCRIPTION" \
            --arg target_url "$TARGET_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data "$payload"

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce aggregate result
        if: always() && steps.aggregate.outputs.state != 'success'
        run: exit 1
