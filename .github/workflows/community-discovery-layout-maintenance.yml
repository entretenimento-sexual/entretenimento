name: Community Discovery Layout Maintenance

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/community-discovery-layout-maintenance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch Community discovery layout and visual assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('src/app/community/discovery/community-discovery-page.component.css')
          css = css_path.read_text()
          old_css = """.community-discovery__grid > li {
            min-width: 0;
          }

          .community-card {
          """
          new_css = """.community-discovery__grid > li {
            min-width: 0;
          }

          .community-card-shell {
            display: grid;
            grid-template-rows: minmax(0, 1fr) auto;
            gap: 0.45rem;
            align-items: stretch;
          }

          .community-card__dismiss {
            max-width: 100%;
            justify-self: start;
          }

          .community-card {
          """
          if old_css not in css:
              raise SystemExit('Expected Community card shell anchor not found')
          css_path.write_text(css.replace(old_css, new_css, 1))

          script_path = Path('.github/scripts/community-discovery-visual-validation.sh')
          script = script_path.read_text()

          old_desktop_setup = """    const cards = Array.from(document.querySelectorAll('.community-card'));
              const dismissButtons = Array.from(document.querySelectorAll('.community-card__dismiss'));
              const create = document.querySelector('.community-discovery__create');
          """
          new_desktop_setup = """    const cards = Array.from(document.querySelectorAll('.community-card'));
              const dismissButtons = Array.from(document.querySelectorAll('.community-card__dismiss'));
              const dismissOverlapsCards = dismissButtons.some((button) => {
                const buttonRect = button.getBoundingClientRect();
                return cards.some((card) => {
                  const cardRect = card.getBoundingClientRect();
                  return buttonRect.left < cardRect.right
                    && buttonRect.right > cardRect.left
                    && buttonRect.top < cardRect.bottom
                    && buttonRect.bottom > cardRect.top;
                });
              });
              const create = document.querySelector('.community-discovery__create');
          """
          if old_desktop_setup not in script:
              raise SystemExit('Expected desktop visual setup anchor not found')
          script = script.replace(old_desktop_setup, new_desktop_setup, 1)

          old_desktop_field = """      dismissMinHeight: dismissButtons.length
                ? Math.min(...dismissButtons.map((button) => button.getBoundingClientRect().height))
                : 0,
          """
          new_desktop_field = """      dismissMinHeight: dismissButtons.length
                ? Math.min(...dismissButtons.map((button) => button.getBoundingClientRect().height))
                : 0,
              dismissOverlapsCards,
          """
          if old_desktop_field not in script:
              raise SystemExit('Expected desktop visual field anchor not found')
          script = script.replace(old_desktop_field, new_desktop_field, 1)

          old_desktop_check = """    || metrics.createHeight < 44
              || metrics.dismissMinHeight < 44
          """
          new_desktop_check = """    || metrics.createHeight < 44
              || metrics.dismissMinHeight < 44
              || metrics.dismissOverlapsCards
          """
          if old_desktop_check not in script:
              raise SystemExit('Expected desktop visual check anchor not found')
          script = script.replace(old_desktop_check, new_desktop_check, 1)

          old_mobile_measure = """    const create = document.querySelector('.community-discovery__create');
              const overflowElements = Array.from(document.querySelectorAll('body *'))
          """
          new_mobile_measure = """    const create = document.querySelector('.community-discovery__create');
              const currentScrollY = window.scrollY;
              window.scrollTo(9999, currentScrollY);
              const windowScrollX = window.scrollX;
              window.scrollTo(0, currentScrollY);
              const overflowElements = Array.from(document.querySelectorAll('body *'))
          """
          if old_mobile_measure not in script:
              raise SystemExit('Expected mobile scroll measurement anchor not found')
          script = script.replace(old_mobile_measure, new_mobile_measure, 1)

          old_mobile_field = """      bodyScrollWidth: document.body.scrollWidth,
              mainWidth: main?.getBoundingClientRect().width ?? 0,
          """
          new_mobile_field = """      bodyScrollWidth: document.body.scrollWidth,
              windowScrollX,
              mainWidth: main?.getBoundingClientRect().width ?? 0,
          """
          if old_mobile_field not in script:
              raise SystemExit('Expected mobile metric field anchor not found')
          script = script.replace(old_mobile_field, new_mobile_field, 1)

          old_mobile_check = """    metrics.scrollWidth > metrics.viewportWidth + 1
              || metrics.gridColumns !== 1
          """
          new_mobile_check = """    metrics.bodyScrollWidth > metrics.viewportWidth + 1
              || metrics.windowScrollX > 1
              || metrics.gridColumns !== 1
          """
          if old_mobile_check not in script:
              raise SystemExit('Expected mobile overflow check anchor not found')
          script = script.replace(old_mobile_check, new_mobile_check, 1)

          script_path.write_text(script)
          PY

      - name: Commit Community discovery layout fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'entretenimento-sexual'
          git config user.email '139718528+entretenimento-sexual@users.noreply.github.com'
          git add \
            src/app/community/discovery/community-discovery-page.component.css \
            .github/scripts/community-discovery-visual-validation.sh
          if git diff --cached --quiet; then
            echo 'No Community discovery layout changes required.'
            exit 0
          fi
          git commit -m 'fix(community): stabilize discovery card actions'
          git push origin HEAD:main
