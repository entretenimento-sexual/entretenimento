name: Video Reconciliation Firestore Emulator

on:
  workflow_dispatch:
  push:
    paths:
      - 'functions/src/media/application/video-processing*'
      - 'functions/src/media/application/video-cancellation*'
      - 'functions/src/media/application/video-transcoder-delete*'
      - 'functions/src/media/application/video-publication-commit.firestore.ts'
      - 'functions/src/media/application/video-publication-source-fence.policy.ts'
      - 'functions/src/media/application/video-publication-source-fence.contract.test.ts'
      - 'functions/src/media/application/manage-video-publication.handler.ts'
      - 'functions/src/media/application/published-video-asset.service.ts'
      - 'functions/src/media/application/published-video-asset-cleanup.firestore.ts'
      - 'functions/src/media/application/published-video-cleanup-migration.firestore.ts'
      - 'functions/src/media/application/published-video-cleanup-queue.firestore.ts'
      - 'functions/src/media/application/video-deletion-queue.firestore.ts'
      - 'functions/src/media/application/video-processing-reconciliation.emulator.test.ts'
      - 'functions/src/media/application/public-video-access-resolution.firestore.ts'
      - 'functions/src/media/application/get-public-video-access-urls.handler.ts'
      - 'functions/src/media/application/public-video-access-resolution.contract.test.ts'
      - 'functions/src/media/application/admin-video-processing-recovery.*'
      - 'scripts/quality/run-video-processing-reconciliation-emulator.mjs'
      - 'firestore.indexes.json'
      - 'scripts/dev/inspect-video-processing-jobs-emulator.mjs'
      - 'scripts/dev/video-processing-job-inventory.policy.mjs'
      - 'scripts/tests/video-processing-job-inventory.test.mjs'
      - 'scripts/dev/video-cancellation-log-audit.policy.mjs'
      - 'scripts/dev/inspect-video-cancellation-logs.mjs'
      - 'scripts/tests/video-cancellation-log-audit.test.mjs'
      - '.github/workflows/video-processing-reconciliation-emulator.yml'

permissions:
  contents: read

concurrency:
  group: video-reconciliation-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Isolated video reconciliation transactions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci
      - name: Verify read-only video inventory classification
        run: node --test scripts/tests/video-processing-job-inventory.test.mjs
      - name: Verify offline scheduler log audit
        run: node --test scripts/tests/video-cancellation-log-audit.test.mjs
      - name: Compile Functions
        run: npm --prefix functions run build
      - name: Test transactions in disposable demo Firestore
        run: node scripts/quality/run-video-processing-reconciliation-emulator.mjs
