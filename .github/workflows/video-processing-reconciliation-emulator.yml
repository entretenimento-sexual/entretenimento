name: Video Reconciliation Firestore Emulator

on:
  workflow_dispatch:
  push:
    paths:
      # Reconcile transactions on every relevant Media release candidate SHA.
      - 'src/app/media/**'
      - 'src/app/core/services/media/**'
      - 'src/app/core/interfaces/media/**'
      - 'src/app/explore/facades/social-explore-media-viewer.facade.ts'
      - 'functions/src/media/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'functions/src/media/application/video-processing*'
      - 'functions/src/media/application/video-scheduler-observability*'
      - 'functions/src/media/application/admin-video-processing-status.handler.ts'
      - 'functions/src/media/application/google-video-transcoder.service.ts'
      - 'functions/src/media/application/video-rotation-worker.service.ts'
      - 'functions/src/media/application/video-source-probe*'
      - 'functions/src/media/application/video-immutable-input*'
      - 'functions/src/media/application/queue-video-processing.handler.ts'
      - 'functions/src/media/application/emulator-video-processing.service.ts'
      - 'services/video-rotation-worker/**'
      - 'functions/src/media/application/google-video-transcoder-edit-config*'
      - 'functions/src/media/application/video-cancellation*'
      - 'functions/src/media/application/video-transcoder-delete*'
      - 'functions/src/media/application/video-publication-commit.firestore.ts'
      - 'functions/src/media/application/published-video-storage-mode.policy*'
      - 'functions/src/media/application/video-publication-source-fence.policy.ts'
      - 'functions/src/media/application/video-publication-source-fence.contract.test.ts'
      - 'functions/src/media/application/manage-video-publication.handler.ts'
      - 'functions/src/media/application/published-video-asset.service.ts'
      - 'functions/src/media/application/published-video-asset-cleanup.firestore.ts'
      - 'functions/src/media/application/published-video-cleanup-migration.firestore.ts'
      - 'functions/src/media/application/published-video-cleanup-queue.firestore.ts'
      - 'functions/src/media/application/video-deletion-queue.firestore.ts'
      - 'functions/src/media/application/video-deletion-*'
      - 'functions/src/media/application/video-identity-guard.*'
      - 'functions/src/media/application/video-original-cleanup.*'
      - 'functions/src/media/application/cleanup-published-video-originals.handler.ts'
      - 'functions/src/media/application/delete-profile-video.handler.ts'
      - 'functions/src/media/application/video-profile-deletion-commit.firestore.ts'
      - 'functions/src/media/application/register-private-video-upload.handler.ts'
      - 'functions/src/media/application/video-processing-reconciliation.emulator.test.ts'
      - 'functions/src/media/application/public-video-access-resolution.firestore.ts'
      - 'functions/src/media/application/get-public-video-access-urls.handler.ts'
      - 'functions/src/media/application/public-video-access-resolution.contract.test.ts'
      - 'functions/src/media/application/admin-video-processing-recovery.*'
      - 'functions/src/media/application/admin-video-triage-*'
      - 'functions/src/account_lifecycle/account-owned-media-deletion.firestore.ts'
      - '.github/workflows/video-processing-reconciliation-emulator.yml'
      - 'scripts/quality/check-video-preventive-moderation-boundary.mjs'
      - 'scripts/quality/run-video-processing-reconciliation-emulator.mjs'
      - 'firestore.indexes.json'
      - 'scripts/dev/inspect-video-processing-jobs-emulator.mjs'
      - 'scripts/dev/video-processing-job-inventory.policy.mjs'
      - 'scripts/tests/video-processing-job-inventory.test.mjs'
      - 'scripts/dev/video-cancellation-log-audit.policy.mjs'
      - 'scripts/dev/inspect-video-cancellation-logs.mjs'
      - 'scripts/tests/video-cancellation-log-audit.test.mjs'
      - 'functions/package.json'
      - 'functions/package-lock.json'
      - 'package.json'
      - 'scripts/tests/photo-e2e-isolation.contract.test.mjs'
      - 'src/app/media/videos/state/video-error-state.architecture.spec.ts'
      - 'src/app/media/videos/state/profile-video-library.reducer.spec.ts'
      - 'src/app/media/videos/public-video-viewer/public-video-viewer-lazy-playback.spec.ts'
      - 'scripts/quality/summarize-photo-e2e-contention.mjs'
      - 'scripts/tests/photo-e2e-contention-audit.test.mjs'
      - 'scripts/tests/photo-e2e-performance.policy.test.mjs'
      - 'scripts/quality/photo-e2e-performance.policy.mjs'
      - 'scripts/dev/video-scheduler-log-audit.policy.mjs'
      - 'scripts/dev/inspect-video-scheduler-logs.mjs'
      - 'scripts/tests/video-scheduler-log-audit.test.mjs'
      - '.github/workflows/video-processing-reconciliation-emulator.yml'

permissions:
  contents: read

concurrency:
  group: video-reconciliation-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Isolated video reconciliation transactions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci
      - name: Verify read-only video inventory classification
        run: node --test scripts/tests/video-processing-job-inventory.test.mjs
      - name: Verify photo E2E isolation and diagnostic-only log summary
        run: node --test scripts/tests/photo-e2e-isolation.contract.test.mjs scripts/tests/photo-e2e-contention-audit.test.mjs scripts/tests/media-transaction-revocation-concurrency.test.mjs scripts/tests/photo-e2e-performance.policy.test.mjs
      - name: Verify offline scheduler log audit
        run: node --test scripts/tests/video-cancellation-log-audit.test.mjs
      - name: Verify unified offline Media scheduler correlation
        run: node --test scripts/tests/video-scheduler-log-audit.test.mjs
      - name: Verify video metadata probe parsing
        run: node --test services/video-rotation-worker/video-probe.test.mjs
      - name: Verify pinned immutable rotation input contract
        run: node --test services/video-rotation-worker/video-rotation-immutable.policy.test.mjs
      - name: Verify canonical Media error boundary
        run: node scripts/quality/check-media-error-boundary.mjs
      - name: Compile Functions
        run: npm --prefix functions run build
      - name: Test transactions in disposable demo Firestore
        run: node scripts/quality/run-video-processing-reconciliation-emulator.mjs
