name: Registration Nickname Callables E2E

on:
  push:
    paths:
      - '.github/workflows/registration-nickname-callables-e2e.yml'
      - 'functions/src/registration/**'
      - 'functions/src/auth/**'
      - 'functions/src/compliance/**'
      - 'functions/src/index.ts'
      - 'functions/src/public_index/**'
      - 'firestore-rules/**'
      - 'scripts/tests/registration-nickname-callables.e2e.mjs'
      - 'scripts/tests/registration-lockdown-candidate.e2e.mjs'
      - 'scripts/maintenance/build-registration-lockdown-candidate.mjs'
      - 'scripts/tests/nickname-reservation-backfill.policy.test.mjs'
      - 'scripts/maintenance/nickname-reservation-backfill.policy.mjs'
      - 'firebase.media-e2e.json'
      - 'package.json'
      - 'package-lock.json'
      - 'functions/package.json'
      - 'functions/package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registration-nickname-callables
  cancel-in-progress: true
jobs:
  integration:
    name: Auth Firestore Functions registration E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci
      - name: Build Rules and Functions
        run: |
          npm run rules:build
          npm run rules:check
          npm run functions:build
          npm run functions:exports:check
      - name: Verify pure backfill policy
        run: npm run nickname:reservation-backfill:policy:test
      # A guarda de runtime exige Auth, Firestore E Storage, mesmo sem upload.
      - name: Verify callables with demo emulators
        run: |
          node node_modules/firebase-tools/lib/bin/firebase.js emulators:exec \
            --config firebase.media-e2e.json \
            --only auth,firestore,functions,storage \
            --project demo-entretenimento-media-e2e \
            "node scripts/tests/registration-nickname-callables.e2e.mjs && node scripts/tests/registration-lockdown-candidate.e2e.mjs"
