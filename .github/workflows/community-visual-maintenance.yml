name: Community Visual Maintenance

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/community-visual-maintenance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch Community mobile tabs and visual diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def block(lines: list[str]) -> str:
              return '\n'.join(lines) + '\n'

          css_path = Path('src/app/community/preview/community-preview-page.component.css')
          css = css_path.read_text()
          old_css = block([
              '  .community-preview__tabs.has-management button span,',
              '  .community-preview__tabs.has-invites button span {',
              '    position: absolute;',
              '    width: 1px;',
              '    height: 1px;',
              '    overflow: hidden;',
              '    clip-path: inset(50%);',
              '    white-space: nowrap;',
              '  }',
              '',
              '  .community-preview__tabs.has-management button,',
              '  .community-preview__tabs.has-invites button {',
              '    font-size: 0.95rem;',
              '  }',
          ])
          new_css = block([
              '  .community-preview__tabs.has-management,',
              '  .community-preview__tabs.has-invites {',
              '    display: flex;',
              '    grid-template-columns: none;',
              '    overflow-x: auto;',
              '    overflow-y: hidden;',
              '    overscroll-behavior-inline: contain;',
              '    scroll-snap-type: inline proximity;',
              '    scrollbar-width: thin;',
              '  }',
              '',
              '  .community-preview__tabs.has-management button,',
              '  .community-preview__tabs.has-invites button {',
              '    flex: 0 0 auto;',
              '    min-width: 5.2rem;',
              '    gap: 0.32rem;',
              '    padding-inline: 0.62rem;',
              '    font-size: 0.72rem;',
              '    scroll-snap-align: start;',
              '  }',
              '',
              '  .community-preview__tabs.has-management button span,',
              '  .community-preview__tabs.has-invites button span {',
              '    position: static;',
              '    width: auto;',
              '    height: auto;',
              '    overflow: visible;',
              '    clip-path: none;',
              '    white-space: nowrap;',
              '  }',
          ])
          if old_css not in css:
              raise SystemExit('Expected mobile tab CSS block not found')
          css_path.write_text(css.replace(old_css, new_css, 1))

          workflow_path = Path('.github/workflows/community-preview-visual-validation.yml')
          workflow = workflow_path.read_text()
          old_metric_setup = block([
              "              const nav = document.querySelector('.community-management-hub__nav');",
              "              const cards = Array.from(document.querySelectorAll('.community-management-hub__card'));",
              '              const cardsInsideViewport = cards.every((card) => {',
          ])
          new_metric_setup = block([
              "              const nav = document.querySelector('.community-management-hub__nav');",
              "              const topTabs = document.querySelector('.community-preview__tabs');",
              '              const topTabLabels = Array.from(',
              "                document.querySelectorAll('.community-preview__tabs button span')",
              '              );',
              '              const topTabLabelsVisible = topTabLabels.every((label) => {',
              '                const rect = label.getBoundingClientRect();',
              '                const style = getComputedStyle(label);',
              '                return rect.width > 1',
              '                  && rect.height > 1',
              "                  && style.visibility !== 'hidden'",
              "                  && style.display !== 'none';",
              '              });',
              "              const cards = Array.from(document.querySelectorAll('.community-management-hub__card'));",
              '              const cardsInsideViewport = cards.every((card) => {',
          ])
          if old_metric_setup not in workflow:
              raise SystemExit('Expected management mobile metric setup not found')
          workflow = workflow.replace(old_metric_setup, new_metric_setup, 1)

          old_metric_fields = block([
              '                navClientWidth: nav?.clientWidth ?? 0,',
              '                navScrollWidth: nav?.scrollWidth ?? 0,',
              "                topTabCount: document.querySelectorAll('.community-preview__tabs button').length,",
              "                navCount: document.querySelectorAll('.community-management-hub__nav button').length,",
          ])
          new_metric_fields = block([
              '                navClientWidth: nav?.clientWidth ?? 0,',
              '                navScrollWidth: nav?.scrollWidth ?? 0,',
              '                topTabsClientWidth: topTabs?.clientWidth ?? 0,',
              '                topTabsScrollWidth: topTabs?.scrollWidth ?? 0,',
              "                topTabCount: document.querySelectorAll('.community-preview__tabs button').length,",
              '                topTabLabelsVisible,',
              "                navCount: document.querySelectorAll('.community-management-hub__nav button').length,",
          ])
          if old_metric_fields not in workflow:
              raise SystemExit('Expected management mobile metric fields not found')
          workflow = workflow.replace(old_metric_fields, new_metric_fields, 1)

          old_metric_checks = block([
              '              || metrics.topTabCount !== 5',
              '              || metrics.navCount !== 5',
              '              || metrics.cardCount !== 7',
          ])
          new_metric_checks = block([
              '              || metrics.topTabCount !== 5',
              '              || !metrics.topTabLabelsVisible',
              '              || metrics.topTabsScrollWidth <= metrics.topTabsClientWidth',
              '              || metrics.navCount !== 5',
              '              || metrics.cardCount !== 7',
          ])
          if old_metric_checks not in workflow:
              raise SystemExit('Expected management mobile metric checks not found')
          workflow = workflow.replace(old_metric_checks, new_metric_checks, 1)

          old_close = block([
              '          playwright-cli screenshot --full-page --filename="$OUT/management/mobile/overview.full-page.png"',
              '',
              '          playwright-cli close',
          ])
          new_close = block([
              '          playwright-cli screenshot --full-page --filename="$OUT/management/mobile/overview.full-page.png"',
              '',
              '          mkdir -p "$OUT/browser-console"',
              '          while IFS= read -r console_file; do',
              '            cp "$console_file" "$OUT/browser-console/$(basename "$console_file")"',
              "          done < <(find .playwright-cli -type f -name 'console-*.log' -print 2>/dev/null || true)",
              '',
              '          playwright-cli close',
          ])
          if old_close not in workflow:
              raise SystemExit('Expected Playwright close block not found')
          workflow_path.write_text(workflow.replace(old_close, new_close, 1))
          PY

      - name: Commit patched Community visual files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'entretenimento-sexual'
          git config user.email '139718528+entretenimento-sexual@users.noreply.github.com'
          git add \
            src/app/community/preview/community-preview-page.component.css \
            .github/workflows/community-preview-visual-validation.yml
          if git diff --cached --quiet; then
            echo 'No visual maintenance changes required.'
            exit 0
          fi
          git commit -m 'fix(community): keep mobile tab labels visible'
          git push origin HEAD:main
