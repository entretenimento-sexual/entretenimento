name: Community Visual Maintenance

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/community-visual-maintenance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch Community visual harness and console assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          harness_path = Path('.github/visual-harness/community-preview-visual.app-component.ts')
          harness = harness_path.read_text()

          old_import = "import { CommunityFeedCommentRepository } from './community/data-access/community-feed-comment.repository';\n"
          new_import = old_import + "import { CommunityHighlightRepository } from './community/data-access/community-highlight.repository';\n"
          if old_import not in harness or 'CommunityHighlightRepository' in harness:
              raise SystemExit('Expected Community highlight import insertion point not found')
          harness = harness.replace(old_import, new_import, 1)

          old_route_marker = """const route = {
"""
          highlight_mock = """const highlightRepository = {
  get$: ({ communityId }: { communityId: string }) => of({
    communityId,
    highlight: null,
    canManage: false,
    generatedAt: Date.now(),
  }),
  manage$: () => NEVER,
};

const route = {
"""
          if old_route_marker not in harness:
              raise SystemExit('Expected Community highlight mock insertion point not found')
          harness = harness.replace(old_route_marker, highlight_mock, 1)

          old_provider = "    { provide: CommunityFeedCommentRepository, useValue: commentRepository },\n"
          new_provider = old_provider + "    { provide: CommunityHighlightRepository, useValue: highlightRepository },\n"
          if old_provider not in harness:
              raise SystemExit('Expected Community highlight provider insertion point not found')
          harness_path.write_text(harness.replace(old_provider, new_provider, 1))

          script_path = Path('.github/scripts/community-preview-visual-validation.sh')
          script = script_path.read_text()
          old_tail = """mkdir -p \"$OUT/browser-console\"
while IFS= read -r console_file; do
  cp \"$console_file\" \"$OUT/browser-console/$(basename \"$console_file\")\"
done < <(find .playwright-cli -type f -name 'console-*.log' -print 2>/dev/null || true)

playwright-cli close
"""
          new_tail = """mkdir -p \"$OUT/browser-console\"
while IFS= read -r console_file; do
  cp \"$console_file\" \"$OUT/browser-console/$(basename \"$console_file\")\"
done < <(find .playwright-cli -type f -name 'console-*.log' -print 2>/dev/null || true)

console_error_count=0
for console_file in \"$OUT\"/browser-console/console-*.log; do
  [[ -e \"$console_file\" ]] || continue
  if grep -q '\[ERROR\]' \"$console_file\"; then
    echo \"Unexpected browser console error in $console_file\" >&2
    cat \"$console_file\" >&2
    console_error_count=$((console_error_count + 1))
  fi
done

playwright-cli close

if (( console_error_count > 0 )); then
  echo \"Community visual validation found browser console errors.\" >&2
  exit 1
fi
"""
          if old_tail not in script:
              raise SystemExit('Expected Community visual console tail not found')
          script_path.write_text(script.replace(old_tail, new_tail, 1))
          PY

      - name: Commit Community visual harness fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'entretenimento-sexual'
          git config user.email '139718528+entretenimento-sexual@users.noreply.github.com'
          git add \
            .github/visual-harness/community-preview-visual.app-component.ts \
            .github/scripts/community-preview-visual-validation.sh
          git commit -m 'fix(ci): make community visual console clean'
          git push origin HEAD:main
