name: Community shell visual harness maintenance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-harness:
    if: github.event.head_commit.message == 'chore(community): run shell visual harness maintenance'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Constrain Community harness to authenticated shell geometry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/visual-harness/community-preview-visual.app-component.ts')
          text = path.read_text(encoding='utf-8')
          old = """  template: `<app-community-preview-page />`,
  styles: [`:host { display: block; min-height: 100vh; }`],
"""
          new = """  template: `
    <div class=\"visual-auth-shell\">
      <aside class=\"visual-auth-shell__sidebar\" aria-hidden=\"true\"></aside>
      <section class=\"visual-auth-shell__content-area\">
        <main class=\"visual-auth-shell__content\">
          <app-community-preview-page />
        </main>
      </section>
    </div>
  `,
  styles: [`
    :host {
      display: block;
      min-height: 100vh;
      --visual-sidebar-width: clamp(272px, 18vw, 320px);
      --visual-sidebar-gap: clamp(12px, 1.2vw, 20px);
    }

    .visual-auth-shell {
      position: relative;
      display: flex;
      min-height: 100vh;
      min-width: 0;
    }

    .visual-auth-shell__sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--visual-sidebar-width);
      pointer-events: none;
    }

    .visual-auth-shell__content-area {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-width: 0;
      margin-left: calc(var(--visual-sidebar-width) + var(--visual-sidebar-gap));
    }

    .visual-auth-shell__content {
      flex: 1;
      min-width: 0;
      padding: clamp(12px, 1.2vw, 24px);
      overflow-x: hidden;
    }

    @media (max-width: 767.98px) {
      .visual-auth-shell__sidebar {
        display: none;
      }

      .visual-auth-shell__content-area {
        margin-left: 0;
      }

      .visual-auth-shell__content {
        padding: 10px 10px 102px;
      }
    }
  `],
"""
          if old not in text:
              raise SystemExit('Expected AppComponent template/styles block was not found; refusing broad replacement.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove maintenance-only workflow
        shell: bash
        run: rm .github/workflows/community-shell-visual-maintenance.yml

      - name: Commit permanent harness change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/visual-harness/community-preview-visual.app-component.ts .github/workflows/community-shell-visual-maintenance.yml
          git commit -m 'test(community): validate page inside authenticated shell'
          git push origin HEAD:main
