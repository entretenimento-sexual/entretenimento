name: Chat Integrated Browser Certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chat-integrated-browser-certification.yml'
      - 'scripts/tests/chat-integrated-browser*.mjs'
      - 'src/**'
      - 'functions/**'
      - 'firestore-rules/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.media-e2e.json'
      - 'angular.json'
      - 'package*.json'

permissions:
  contents: read

concurrency:
  group: chat-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chat-browser:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: chromium, replica: 1, artifact: r1 }
          - { engine: chromium, replica: 2, artifact: r2 }
          - { engine: chromium, replica: 3, artifact: r3 }
          - { engine: firefox, replica: 1, artifact: firefox-r1 }
          - { engine: webkit, replica: 1, artifact: webkit-r1 }
    timeout-minutes: 35
    env:
      CI: 'true'
      CHAT_BROWSER_ENGINE: ${{ matrix.engine }}
      CHAT_BROWSER_ARTIFACTS: artifacts/chat-browser
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test attempt accounting
        run: node --test scripts/tests/chat-integrated-browser-metrics.test.mjs
      - name: Install application and Functions
        run: |
          npm ci
          npm --prefix functions ci
      - name: Install isolated browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/chat-browser-playwright" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/chat-browser-playwright/node_modules/.bin/playwright" install --with-deps "$CHAT_BROWSER_ENGINE"
      - name: Prepare disposable demo topology
        run: |
          mkdir -p "$CHAT_BROWSER_ARTIFACTS"
          node scripts/tests/chat-integrated-browser-prepare.mjs
          npm run rules:build
          npm run rules:check
          npm run functions:build
      - name: Run actual Angular and Firebase browser scenarios
        shell: bash
        run: |
          set -euo pipefail
          export CHAT_BROWSER_PLAYWRIGHT="$RUNNER_TEMP/chat-browser-playwright/node_modules/playwright/index.mjs"
          npx --no-install firebase emulators:exec --config firebase.chat-browser-ci.json --only auth,firestore,storage,functions,database --project demo-entretenimento-media-e2e "node scripts/tests/chat-integrated-browser.e2e.mjs" 2>&1 | tee "$CHAT_BROWSER_ARTIFACTS/emulator.log"
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-browser-${{ github.sha }}-${{ matrix.artifact }}
          path: artifacts/chat-browser
          if-no-files-found: error
