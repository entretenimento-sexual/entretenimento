name: Community visual console maintenance

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/community-visual-console-maintenance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch visual harness and console enforcement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          harness = Path('.github/visual-harness/community-discovery-visual.app-component.ts')
          text = harness.read_text()
          import_anchor = "import { CommunityDiscoveryCacheService } from './community/discovery/community-discovery-cache.service';\n"
          import_insert = import_anchor + "import { CommunityDiscoveryExposureService } from './community/discovery/community-discovery-exposure.service';\n"
          if import_anchor not in text:
              raise SystemExit('Community discovery exposure import anchor not found')
          if 'CommunityDiscoveryExposureService' not in text:
              text = text.replace(import_anchor, import_insert, 1)

          provider_anchor = "    { provide: CommunityDiscoveryCacheService, useValue: discoveryCache },\n"
          provider_insert = provider_anchor + "    { provide: CommunityDiscoveryExposureService, useValue: { recordQualifiedExposure: () => undefined } },\n"
          if provider_anchor not in text:
              raise SystemExit('Community discovery exposure provider anchor not found')
          if 'provide: CommunityDiscoveryExposureService' not in text:
              text = text.replace(provider_anchor, provider_insert, 1)
          harness.write_text(text)

          script = Path('.github/scripts/community-discovery-visual-validation.sh')
          text = script.read_text()
          old = '''for console_file in "${console_files[@]}"; do
            if grep -q '\\[ERROR\\]' "$console_file"; then
              echo "Unexpected browser console error in $console_file" >&2
              cat "$console_file" >&2
              console_error_count=$((console_error_count + 1))
            fi
          done
'''
          new = '''for console_file in "${console_files[@]}"; do
            if ! grep -q '^Console: 0 errors,' "$console_file"; then
              echo "Unexpected browser console error or invalid console summary in $console_file" >&2
              cat "$console_file" >&2
              console_error_count=$((console_error_count + 1))
            fi
          done
'''
          if old not in text:
              raise SystemExit('Console validation anchor not found')
          text = text.replace(old, new, 1)
          script.write_text(text)
          PY

          git diff --check
          git diff -- .github/visual-harness/community-discovery-visual.app-component.ts .github/scripts/community-discovery-visual-validation.sh

          if git diff --quiet; then
            echo 'No maintenance changes required.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/visual-harness/community-discovery-visual.app-component.ts .github/scripts/community-discovery-visual-validation.sh
          git commit -m 'test(community): harden discovery visual console validation'
          git push origin HEAD:main
