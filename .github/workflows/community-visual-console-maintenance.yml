name: Community visual console maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/community-visual-console-maintenance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch permanent visual validation
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          harness = Path('.github/visual-harness/community-discovery-visual.app-component.ts')
          text = harness.read_text()
          anchor = "import { CommunityDiscoveryCacheService } from './community/discovery/community-discovery-cache.service';\n"
          addition = "import { CommunityDiscoveryExposureService } from './community/discovery/community-discovery-exposure.service';\n"
          if anchor not in text:
              raise SystemExit('exposure import anchor not found')
          if addition not in text:
              text = text.replace(anchor, anchor + addition, 1)

          anchor = "    { provide: CommunityDiscoveryCacheService, useValue: discoveryCache },\n"
          addition = "    { provide: CommunityDiscoveryExposureService, useValue: { recordQualifiedExposure: () => undefined } },\n"
          if anchor not in text:
              raise SystemExit('exposure provider anchor not found')
          if addition not in text:
              text = text.replace(anchor, anchor + addition, 1)
          harness.write_text(text)

          script = Path('.github/scripts/community-discovery-visual-validation.sh')
          text = script.read_text()
          old = r'''  if grep -q '\[ERROR\]' "$console_file"; then'''
          new = r'''  if ! grep -q '^Console: 0 errors,' "$console_file"; then'''
          if old not in text:
              raise SystemExit('console enforcement anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '    echo "Unexpected browser console error in $console_file" >&2',
              '    echo "Unexpected browser console error or invalid console summary in $console_file" >&2',
              1,
          )
          script.write_text(text)
          PY

          git diff --check
          git diff -- .github/visual-harness/community-discovery-visual.app-component.ts .github/scripts/community-discovery-visual-validation.sh

          test -n "$(git status --porcelain)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/visual-harness/community-discovery-visual.app-component.ts .github/scripts/community-discovery-visual-validation.sh
          git commit -m 'test(community): harden discovery visual console validation'
          git push origin HEAD:main
