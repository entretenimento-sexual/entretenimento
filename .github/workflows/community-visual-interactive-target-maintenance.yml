name: Community visual interactive target maintenance

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/community-visual-interactive-target-maintenance.py'
      - '.github/workflows/community-visual-interactive-target-maintenance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fix interactive target selector
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/community-visual-interactive-target-maintenance.py
          git diff --check
          git rm .github/scripts/community-visual-interactive-target-maintenance.py
          git rm .github/workflows/community-visual-interactive-target-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/community-preview-visual-validation.sh
          git commit -m 'test(community): measure only interactive post targets'
          git push origin HEAD:main
