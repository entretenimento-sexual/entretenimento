<section class="friend-search app-page" aria-label="Buscar amizades">
  <app-page-header title="Buscar amizades" />

  <label class="app-field" for="friend-search-input">
    <span class="app-field__label">Nome ou UID</span>
    <input
      id="friend-search-input"
      class="app-control"
      type="search"
      autocomplete="off"
      [formControl]="searchControl"
      placeholder="Digite um nome ou UID"
    />
  </label>

  @if (isLoading$ | async) {
    <app-content-state
      state="loading"
      message="Buscando usuários..."
      [compact]="true"
      [skeletonRows]="2"
    />
  } @else if (searchControl.value.trim() && !(hasResults$ | async)) {
    <app-content-state
      state="empty"
      title="Nenhum usuário encontrado"
      message="Revise o nome ou UID informado e tente novamente."
      [compact]="true"
    />
  }

  @if (searchResults$ | async; as results) {
    @if (results.length) {
      <ul class="friend-search__results" aria-label="Resultados da busca">
        @for (user of results; track user.uid) {
          <li class="friend-search__result app-card app-card--flat">
            <div class="friend-search__identity">
              <strong>{{ user.nickname || user.uid }}</strong>
              @if (user.nickname) {
                <span>{{ user.uid }}</span>
              }
            </div>

            <button
              type="button"
              class="app-action app-action--primary"
              [disabled]="sendingUid() === user.uid"
              [attr.aria-busy]="sendingUid() === user.uid ? 'true' : null"
              (click)="addFriend(user)"
            >
              {{ sendingUid() === user.uid ? 'Enviando...' : 'Adicionar amigo' }}
            </button>
          </li>
        }
      </ul>
    }
  }
</section>
