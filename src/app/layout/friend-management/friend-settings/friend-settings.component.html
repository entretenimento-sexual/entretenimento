<section class="friend-settings app-page" aria-label="Configurações de amizade">
  <app-page-header
    title="Configurações de amizade"
    subtitle="Controle solicitações, presença online e descoberta pelo nickname."
  />

  <form class="friend-settings__form app-card app-card--flat" [formGroup]="settingsForm">
    <mat-slide-toggle formControlName="receiveRequests">
      Receber solicitações
    </mat-slide-toggle>

    <mat-slide-toggle formControlName="showOnlineStatus">
      Mostrar status online
    </mat-slide-toggle>

    <mat-slide-toggle formControlName="allowSearchByNickname">
      Permitir busca pelo nickname
    </mat-slide-toggle>

    <button
      type="button"
      class="app-action app-action--primary"
      [disabled]="isLoading$ | async"
      [attr.aria-busy]="(isLoading$ | async) ? 'true' : null"
      (click)="saveSettings()"
    >
      {{ (isLoading$ | async) ? 'Salvando…' : 'Salvar configurações' }}
    </button>
  </form>
</section>
