<section class="friend-settings" aria-labelledby="friend-settings-title">
  <header class="app-section-header">
    <div class="app-section-heading">
      <h2 id="friend-settings-title" class="app-section-title">Amizade</h2>
    </div>
  </header>

  <form [formGroup]="settingsForm">
    <mat-slide-toggle formControlName="receiveRequests">
      Receber solicitações
    </mat-slide-toggle>

    <mat-slide-toggle formControlName="showOnlineStatus">
      Mostrar status online
    </mat-slide-toggle>

    <mat-slide-toggle formControlName="allowSearchByNickname">
      Permitir busca pelo nickname
    </mat-slide-toggle>

    <button
      type="button"
      class="app-action app-action--primary"
      [disabled]="isLoading$ | async"
      (click)="saveSettings()"
    >
      {{ (isLoading$ | async) ? 'Salvando…' : 'Salvar' }}
    </button>
  </form>

  @if (isLoading$ | async) {
    <mat-spinner aria-label="Salvando configurações"></mat-spinner>
  }
</section>
