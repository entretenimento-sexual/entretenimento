<section class="friend-blocked app-page" aria-label="Perfis bloqueados">
  <app-page-header
    title="Perfis bloqueados"
    subtitle="Revise quem está impedido de tentar contato. Desbloqueie apenas quando tiver certeza de que a aproximação pode ser retomada."
  />

  @let blockedUsers = (blockedUsers$ | async) || [];

  @if (blockedUsers.length) {
    <ul class="friend-blocked__list" aria-label="Lista de perfis bloqueados">
      @for (blocked of blockedUsers; track blocked.uid) {
        <li class="friend-blocked__item app-card app-card--flat">
          <div class="friend-blocked__identity">
            <span class="friend-blocked__avatar" aria-hidden="true">⛔</span>

            <div>
              <strong>Perfil bloqueado</strong>
              <span>{{ blocked.uid }}</span>
            </div>
          </div>

          <button
            type="button"
            class="app-action app-action--ghost"
            (click)="unblockUser(blocked.uid)"
            [attr.aria-label]="'Desbloquear perfil ' + blocked.uid"
          >
            Desbloquear
          </button>
        </li>
      }
    </ul>
  } @else {
    <app-content-state
      state="empty"
      title="Nenhum perfil bloqueado"
      message="Quando você bloquear alguém, o perfil aparecerá aqui para revisão futura."
      [compact]="true"
    />
  }
</section>
