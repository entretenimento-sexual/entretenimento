<main class="adult-consent" aria-label="Aceite do acesso adulto">
  <section class="adult-consent__shell">
    <div class="adult-consent__brand" aria-hidden="true">
      <span class="adult-consent__brand-mark">18+</span>
      <span>SEXO É O LIMITE</span>
    </div>

    <article class="adult-consent__card app-card app-card--flat" [attr.aria-busy]="isSaving">
      <div class="adult-consent__icon" aria-hidden="true">🔐</div>

      <app-page-header
        title="Aceite o acesso à experiência adulta"
        subtitle="Esta etapa registra seu aceite para acessar conteúdo e interações adultas. A maioridade é verificada separadamente pela plataforma."
      />

      <ul class="adult-consent__checks" aria-label="Condições para continuar">
        <li>Sua maioridade já precisa estar confirmada pela plataforma.</li>
        <li>Você aceita acessar conteúdo e interações para adultos.</li>
        <li>Você entende que respeito, consentimento e privacidade são obrigatórios.</li>
      </ul>

      <div class="adult-consent__actions">
        <button
          type="button"
          class="app-action app-action--primary"
          [disabled]="isSaving"
          (click)="accept()"
        >
          {{ isSaving ? 'Salvando...' : 'Aceitar e continuar' }}
        </button>

        <button
          type="button"
          class="app-action app-action--ghost"
          [disabled]="isSaving"
          (click)="decline()"
        >
          Sair
        </button>
      </div>
    </article>
  </section>
</main>
