<div
  class="public-media-engagement-actions"
  aria-label="Ações da publicação"
>
  <button
    type="button"
    class="public-media-engagement-actions__button"
    [class.public-media-engagement-actions__button--active]="liked()"
    [disabled]="!reactionsEnabled() || reactionPending()"
    [attr.aria-pressed]="liked()"
    [attr.aria-busy]="reactionPending() ? 'true' : null"
    [attr.aria-label]="
      liked()
        ? 'Remover curtida. ' + reactionCountLabel() + ' curtidas.'
        : 'Curtir publicação. ' + reactionCountLabel() + ' curtidas.'
    "
    (click)="toggleLike()"
  >
    @if (reactionPending()) {
      <i class="fas fa-circle-notch fa-spin" aria-hidden="true"></i>
    } @else {
      <i
        [class]="liked() ? 'fas fa-heart' : 'far fa-heart'"
        aria-hidden="true"
      ></i>
    }
    <span>{{ reactionCountLabel() }}</span>
  </button>

  <button
    type="button"
    class="public-media-engagement-actions__button"
    [disabled]="!commentsEnabled()"
    [attr.aria-label]="
      commentsEnabled()
        ? 'Abrir comentários. ' + commentCountLabel() + ' comentários.'
        : 'Comentários desativados nesta publicação.'
    "
    (click)="requestComments()"
  >
    <i class="far fa-comment" aria-hidden="true"></i>
    <span>{{ commentCountLabel() }}</span>
  </button>

  <span
    class="public-media-engagement-actions__announcement"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  >
    {{ announcement() }}
  </span>
</div>
