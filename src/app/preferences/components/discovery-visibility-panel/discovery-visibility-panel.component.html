<!-- src\app\preferences\components\discovery-visibility-panel\discovery-visibility-panel.component.html -->
<section
  class="discovery-visibility-panel"
  aria-label="Estado atual da descoberta e privacidade"
>
  <div class="panel-badges" aria-label="Estado atual de descoberta">
      <span class="panel-badge">{{ discoveryModeLabel() }}</span>
      <span class="panel-badge">Badges: {{ showBadgesLabel() }}</span>
      <span class="panel-badge">Intenção: {{ showIntentPubliclyLabel() }}</span>
  </div>

  <div class="panel-grid" role="list">
    @for (item of availabilityItems(); track item.label) {
      <article class="panel-item" role="listitem">
        <div class="panel-item-header">
          <span class="panel-item-label">{{ item.label }}</span>
          <strong class="panel-item-status">
            {{ item.enabled ? 'Liberado' : 'Bloqueado' }}
          </strong>
        </div>

        <p class="panel-item-hint">
          {{ item.hint }}
        </p>
      </article>
    }
  </div>

  <footer class="panel-footer">
    <p class="panel-footnote">
      {{ monetizationHint() }}
    </p>
  </footer>
</section>
