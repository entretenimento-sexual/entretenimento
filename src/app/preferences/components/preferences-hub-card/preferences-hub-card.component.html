<!-- src\app\preferences\components\preferences-hub-card\preferences-hub-card.component.html -->
<a
  class="hub-card app-card app-card--flat app-card--interactive"
  [routerLink]="route()"
  [attr.aria-label]="'Abrir ' + title()"
>
  <div class="hub-card__copy">
    <div class="hub-card__title-row">
      <strong class="hub-card-title app-card__title">{{ title() }}</strong>

      @if (badge()) {
        <span class="hub-card-badge app-chip app-chip--muted">{{ badge() }}</span>
      }
    </div>

    <p class="hub-card-description">{{ description() }}</p>
  </div>

  <span class="hub-card__arrow" aria-hidden="true">→</span>
</a>
