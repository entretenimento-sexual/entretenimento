<section class="preferences-summary-card app-card app-card--flat" aria-label="Resumo das preferências">
  @if (vm()) {
    <div class="summary-context" aria-label="Estado atual das preferências">
      <span>{{ discoveryModeLabel() }}</span>
      <span aria-hidden="true">·</span>
      <span>{{ currentModeLabel() }}</span>
      <span aria-hidden="true">·</span>
      <strong>{{ availableNowLabel() }}</strong>
    </div>

    <dl class="summary-list">
      <div>
        <dt>Intenções</dt>
        <dd>{{ relationshipIntentSummary() }}</dd>
      </div>

      <div>
        <dt>Interesses de gênero</dt>
        <dd>{{ acceptedGendersSummary() }}</dd>
      </div>

      <div>
        <dt>Práticas</dt>
        <dd>{{ practicesSummary() }}</dd>
      </div>
    </dl>
  } @else {
    <div class="summary-empty" role="status" aria-live="polite">
      Carregando resumo das preferências...
    </div>
  }
</section>
