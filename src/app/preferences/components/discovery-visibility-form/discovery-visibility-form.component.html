<!-- src/app/preferences/components/discovery-visibility-form/discovery-visibility-form.component.html -->
<form
  class="discovery-visibility-form"
  [formGroup]="form"
  (ngSubmit)="submit()"
  aria-label="Formulário de configurações de descoberta"
>
  <section class="form-section" aria-label="Configurações de descoberta">
    <div class="form-grid app-responsive-grid">
      <div class="app-field">
        <label for="discoveryMode">Como você quer aparecer</label>
        <select class="app-control" id="discoveryMode" formControlName="discoveryMode">
          @for (option of discoveryModeOptions; track option.key) {
            <option
              [value]="option.key"
              [disabled]="!isModeAvailable(option.key)"
            >
              {{ option.label }}{{ modeRequirement(option.key) }}
            </option>
          }
        </select>
      </div>

      <label class="checkbox-item inline-item app-choice">
        <input type="checkbox" formControlName="showPreferenceBadges" />
        <span>Exibir sinais de preferências</span>
      </label>

      <label class="checkbox-item inline-item app-choice">
        <input type="checkbox" formControlName="showIntentPublicly" />
        <span>Exibir disponibilidade publicamente</span>
      </label>
    </div>
  </section>

  <footer class="form-actions app-form-actions">
    <button
      type="submit"
      class="app-action app-action--primary"
      [disabled]="!canEdit() || saving()"
      [attr.aria-busy]="saving() ? 'true' : 'false'"
    >
      {{ saving() ? 'Salvando…' : 'Salvar descoberta e visibilidade' }}
    </button>
  </footer>
</form>
