<!-- src\app\preferences\pages\preferences-hub\preferences-hub.component.html -->
<main class="preferences-hub-page app-page" aria-label="Preferências da conta">
  <section class="preferences-hub-shell stack container-wide">
    <app-page-header title="Preferências">
      <a
        page-actions
        class="app-action app-action--ghost"
        routerLink="/perfil"
      >
        Voltar ao perfil
      </a>
    </app-page-header>

    @if (uid$ | async; as uid) {
      @if (uid) {
        <div class="hub-grid app-responsive-grid" aria-label="Ajustes de preferências">
          <app-preferences-hub-card
            title="Editar preferências"
            description="Atualize o que você procura, quem gostaria de conhecer e o alcance das combinações."
            route="/preferencias/editar">
          </app-preferences-hub-card>

          <app-preferences-hub-card
            title="Descoberta e privacidade"
            description="Defina como seu perfil aparece em buscas, sugestões e recursos regionais."
            route="/preferencias/discovery-settings">
          </app-preferences-hub-card>

          <app-preferences-hub-card
            title="Notificações"
            description="Escolha quais avisos de mensagens, conexões e atividades você quer receber."
            route="/preferencias/notificacoes">
          </app-preferences-hub-card>
        </div>

      } @else {
        <section class="hub-empty section app-card app-card--flat" aria-label="Sem sessão ativa">
          <p>Você precisa estar autenticado para acessar suas preferências.</p>
        </section>
      }
    } @else {
      <section class="hub-empty section app-card app-card--flat" aria-label="Carregando preferências">
        <p>Carregando suas preferências...</p>
      </section>
    }
  </section>
</main>
