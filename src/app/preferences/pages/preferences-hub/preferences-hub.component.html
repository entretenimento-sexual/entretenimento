<!-- src\app\preferences\pages\preferences-hub\preferences-hub.component.html -->
<main class="preferences-hub-page app-page" aria-label="Preferências da conta">
  <section class="preferences-hub-shell stack container-wide">
    <app-page-header title="Preferências">
      <a
        page-actions
        class="app-action app-action--ghost"
        routerLink="/perfil"
      >
        Voltar ao perfil
      </a>
    </app-page-header>

    @if (vm$ | async; as vm) {
      @if (vm) {
        <app-preference-summary-card [vm]="vm"></app-preference-summary-card>

        <section class="hub-section" aria-labelledby="hub-main-title">
          <h2 id="hub-main-title" class="hub-section__title">Ajustes principais</h2>

          <div class="hub-grid app-responsive-grid">
            <app-preferences-hub-card
              title="Editar preferências"
              description="Atualize intenção, perfil, visibilidade e informações usadas para descoberta."
              route="/preferencias/editar">
            </app-preferences-hub-card>

            <app-preferences-hub-card
              title="Descoberta e privacidade"
              description="Defina como seu perfil aparece em buscas, sugestões e recursos regionais."
              route="/preferencias/discovery-settings">
            </app-preferences-hub-card>

            <app-preferences-hub-card
              title="Notificações"
              description="Escolha quais avisos de mensagens, conexões e atividades você quer receber."
              route="/preferencias/notificacoes">
            </app-preferences-hub-card>
          </div>
        </section>

        <section class="hub-section" aria-labelledby="hub-compatibility-title">
          <h2 id="hub-compatibility-title" class="hub-section__title">Compatibilidade</h2>

          <div class="hub-grid app-responsive-grid">
            <app-preferences-hub-card
              title="Perfil para combinações"
              description="Revise os dados usados para compatibilidade e descoberta entre perfis."
              route="/preferencias/match-profile">
            </app-preferences-hub-card>

            <app-preferences-hub-card
              title="Comparar compatibilidade"
              description="Veja como suas preferências se relacionam com outro perfil."
              [route]="'/preferencias/compatibility-lab/' + vm.uid">
            </app-preferences-hub-card>

            @if (lastCompatibilityTargetUid()) {
              <app-preferences-hub-card
                title="Retomar última comparação"
                description="Volte para a comparação de compatibilidade acessada mais recentemente."
                [route]="'/preferencias/compatibility-lab/' + lastCompatibilityTargetUid()">
              </app-preferences-hub-card>
            }
          </div>
        </section>
      } @else {
        <section class="hub-empty section app-card app-card--flat" aria-label="Sem sessão ativa">
          <p>Você precisa estar autenticado para acessar suas preferências.</p>
        </section>
      }
    } @else {
      <section class="hub-empty section app-card app-card--flat" aria-label="Carregando preferências">
        <p>Carregando suas preferências...</p>
      </section>
    }
  </section>
</main>
