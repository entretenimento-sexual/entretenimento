<!-- src\app\preferences\pages\discovery-settings\discovery-settings.component.html -->
 <!-- simplicidade e idioma português -->
<main class="discovery-settings-page app-page" aria-label="Configurações de descoberta">
  <section class="discovery-settings-shell stack container-wide">
    <app-page-header title="Descoberta e privacidade">
      <a
        page-actions
        class="app-action app-action--ghost"
        routerLink="/preferencias"
      >
        Voltar
      </a>
    </app-page-header>

    @if (vm$ | async; as vm) {
      @if (vm) {
        <app-discovery-visibility-panel
          [profile]="vm.profile"
          [capabilities]="vm.capabilities">
        </app-discovery-visibility-panel>

        <section class="discovery-settings-section app-card app-card--flat" aria-label="Editar descoberta e privacidade">
          <app-discovery-visibility-form
            [visibility]="vm.visibility"
            [capabilities]="vm.capabilities"
            [saving]="isSaving()"
            (saveVisibility)="onSave(vm.uid, $event)">
          </app-discovery-visibility-form>
        </section>

        <app-discovery-upgrade-hints
          [capabilities]="vm.capabilities">
        </app-discovery-upgrade-hints>
      } @else {
        <section class="discovery-settings-section app-card app-card--flat" aria-label="Sem sessão ativa">
          <p>Você precisa estar autenticado para acessar esta área.</p>
        </section>
      }
    } @else {
      <section class="discovery-settings-section app-card app-card--flat" aria-label="Carregando configurações de descoberta">
        <p>Carregando configurações de descoberta...</p>
      </section>
    }
  </section>
</main>
