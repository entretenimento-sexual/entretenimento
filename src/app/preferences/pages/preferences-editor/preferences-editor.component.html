<!-- src/app/preferences/pages/preferences-editor/preferences-editor.component.html -->
<main class="preferences-editor-page app-page" aria-label="Editor de preferências">
  <section class="preferences-editor-shell">
    <app-preferences-page-header title="Preferências">
      <a
        page-actions
        class="app-action app-action--ghost"
        routerLink="/preferencias"
      >
        Voltar
      </a>
    </app-preferences-page-header>

    @if (state$ | async; as state) {
      <section class="plan-strip" aria-label="Plano e recursos disponíveis">
        <div class="plan-strip__copy">
          <strong>Plano {{ state.capabilities.currentPlanLabel }}</strong>
        </div>

        @if (nextPlan(state.capabilities); as minimumPlan) {
          <a
            class="app-action app-action--ghost"
            routerLink="/subscription-plan"
            [queryParams]="{ minimumRole: minimumPlan }"
          >
            Ver planos
          </a>
        }
      </section>

      <section
        class="editor-section"
        aria-labelledby="preferencesProfileTitle"
      >
        <header class="app-section-header">
          <div class="app-section-heading">
            <h2
              id="preferencesProfileTitle"
              class="app-section-title"
            >
              O que você procura
            </h2>
          </div>
        </header>

        <app-preference-profile-form
          [profile]="state.profile"
          [capabilities]="state.capabilities"
          [saving]="isSavingProfile()"
          (saveProfile)="onSaveProfile(state.uid, $event)"
        >
        </app-preference-profile-form>
      </section>

      <details class="availability-section app-disclosure">
        <summary class="app-disclosure__summary">
          <strong class="app-disclosure__title">Disponibilidade atual</strong>
          <span class="app-disclosure__state">
            {{ intentSummary(state.intent) }}
          </span>
        </summary>

        <div class="availability-section__content app-disclosure__content">
          <app-intent-state-form
            [intent]="state.intent"
            [capabilities]="state.capabilities"
            [saving]="isSavingIntent()"
            (saveIntent)="onSaveIntent(state.uid, $event)"
          >
          </app-intent-state-form>
        </div>
      </details>
    } @else {
      <section
        class="editor-loading"
        role="status"
        aria-live="polite"
        aria-label="Carregando preferências"
      >
        <span class="editor-loading__spinner" aria-hidden="true"></span>
        <span>Carregando suas preferências…</span>
      </section>
    }
  </section>
</main>
