<!-- src/app/admin-dashboard/user-details/user-details.component.html -->
<mat-card *ngIf="user as u">
  <mat-card-header>
    <mat-card-title>{{ u.nickname || 'Usuário sem apelido' }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <p><strong>UID:</strong> {{ u.uid }}</p>
    <p>
      <strong>Status:</strong>
      <mat-chip [color]="userStatusLabel(u) === 'Ativa' ? 'primary' : 'warn'" selected>
        {{ userStatusLabel(u) }}
      </mat-chip>
    </p>
  </mat-card-content>

  <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

  <mat-card-actions align="end">
    <button
      mat-stroked-button
      type="button"
      [disabled]="loading"
      (click)="issueComplianceNotice()"
    >
      Notificar possível violação
    </button>
    <button
      mat-stroked-button
      color="primary"
      type="button"
      [disabled]="loading"
      (click)="!u.suspended ? suspendUser() : unsuspendUser()"
    >
      {{ u.suspended ? 'Reativar' : 'Suspender' }}
    </button>
    <button
      mat-raised-button
      color="warn"
      type="button"
      [disabled]="loading"
      (click)="deleteUser()"
    >
      Excluir
    </button>
  </mat-card-actions>
</mat-card>
