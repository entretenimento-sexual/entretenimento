@let content = item();

<article class="community-content-card app-card app-card--flat app-card--compact">
  <a
    class="community-content-card__community"
    [routerLink]="['/dashboard/comunidades', content.communityId]"
    [queryParams]="{ post: content.postId }"
    [attr.aria-label]="'Abrir publicação na Comunidade ' + content.community.name"
    (click)="recordOpen()"
  >
    <span class="community-content-card__community-avatar" aria-hidden="true">
      @if (content.community.avatarUrl) {
        <img
          [src]="content.community.avatarUrl"
          alt=""
          width="42"
          height="42"
          loading="lazy"
          decoding="async"
          referrerpolicy="no-referrer"
        />
      } @else {
        {{ initials(content.community.name) }}
      }
    </span>

    <span class="community-content-card__community-copy">
      <span>Da Comunidade</span>
      <strong>{{ content.community.name }}</strong>
    </span>
  </a>

  <app-public-user-identity
    class="community-content-card__author"
    [identity]="authorIdentity()"
    density="compact"
  />

  @if (content.post.text) {
    <p class="community-content-card__text">{{ content.post.text }}</p>
  }

  @if (content.post.image) {
    <a
      class="community-content-card__media app-media-frame"
      [routerLink]="['/dashboard/comunidades', content.communityId]"
      [queryParams]="{ post: content.postId }"
      [attr.aria-label]="'Ver foto publicada em ' + content.community.name"
      (click)="recordOpen()"
    >
      <img
        [src]="content.post.image.url"
        [alt]="content.post.image.alt"
        loading="lazy"
        decoding="async"
        referrerpolicy="no-referrer"
      />
    </a>
  }

  <a
    class="community-content-card__action app-action app-action--ghost"
    [routerLink]="['/dashboard/comunidades', content.communityId]"
    [queryParams]="{ post: content.postId }"
    (click)="recordOpen()"
  >
    Ver na Comunidade
  </a>
</article>
