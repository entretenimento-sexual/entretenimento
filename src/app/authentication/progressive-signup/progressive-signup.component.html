<main class="progressive-signup container-reading">
  <app-page-header
    title="O que desperta seu interesse?"
    subtitle="Escolha o que fizer sentido agora. Você pode ajustar tudo depois nas Preferências."
  ></app-page-header>

  <form
    class="progressive-signup__form app-card app-card--flat"
    (submit)="register()"
    aria-label="Interesses iniciais"
  >
    <div class="progressive-signup__choices" role="group" aria-label="Interesses">
      @for (practice of practices; track practice.value) {
        <label class="app-choice">
          <input
            type="checkbox"
            name="practices"
            [value]="practice.value"
            (change)="capturePreference($event, practice.value)"
          />
          <span>{{ practice.label }}</span>
        </label>
      }
    </div>

    <div class="app-form-actions">
      <button type="submit" class="app-action app-action--primary">
        Continuar
      </button>
    </div>
  </form>
</main>
