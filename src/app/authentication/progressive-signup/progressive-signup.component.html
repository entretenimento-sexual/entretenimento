<main class="progressive-signup container-reading">
  <app-page-header
    title="O que desperta seu interesse?"
    subtitle="Escolha o que fizer sentido agora. Você pode ajustar tudo depois nas Preferências."
  ></app-page-header>

  @if (loading) {
    <app-content-state
      state="loading"
      message="Carregando suas preferências."
      [compact]="true"
    ></app-content-state>
  } @else {
    <form
      class="progressive-signup__form app-card app-card--flat"
      (submit)="register()"
      aria-label="Interesses iniciais"
    >
      <div class="progressive-signup__choices" role="group" aria-label="Interesses">
        @for (practice of practices; track practice.value) {
          <label class="app-choice">
            <input
              type="checkbox"
              name="practices"
              [value]="practice.value"
              [checked]="isSelected(practice.value)"
              (change)="capturePreference($event, practice.value)"
            />
            <span>{{ practice.label }}</span>
          </label>
        }
      </div>

      <p class="progressive-signup__note">
        Essas escolhas ajudam a personalizar descoberta e sugestões. Nada aqui
        define sua identidade e você pode alterar ou apagar as seleções depois.
      </p>

      <div class="app-form-actions">
        <button
          type="button"
          class="app-action app-action--ghost"
          (click)="skipForNow()"
          [disabled]="saving"
        >
          Pular por agora
        </button>

        <button
          type="submit"
          class="app-action app-action--primary"
          [disabled]="saving"
          [attr.aria-busy]="saving ? 'true' : null"
        >
          {{ saving ? 'Salvando...' : 'Salvar e continuar' }}
        </button>
      </div>
    </form>
  }
</main>
