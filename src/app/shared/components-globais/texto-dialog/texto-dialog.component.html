<!-- src\app\shared\components-globais\texto-dialog\texto-dialog.component.html -->
<div class="container_text_dialog app-card app-card--media">
  <h2 mat-dialog-title>Adicione uma descrição para essa foto</h2>

  <div class="separa">
    <mat-dialog-content class="texto-dialog-content">

        <mat-form-field appearance="outline">
          <mat-label>Descrição</mat-label>
          <textarea matInput [(ngModel)]="descricao"></textarea>
        </mat-form-field>

    </mat-dialog-content>
  </div>

    <mat-dialog-actions align="center" class="texto-dialog-actions">
      <button type="button" class="app-action app-action--ghost" (click)="dialogRef.close()">Cancelar</button>
      <button type="button" class="app-action app-action--primary" (click)="confirmar()">Salvar Foto</button>
    </mat-dialog-actions>
</div><!--container_text_dialog-->
