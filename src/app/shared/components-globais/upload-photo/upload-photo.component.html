<!-- src/app/shared/components-globais/upload-photo/upload-photo.component.html -->
<section
  class="upload-modal-content app-card app-card--media"
  aria-labelledby="upload-photo-title"
  [attr.aria-busy]="isLoading ? 'true' : null"
>
  <button
    type="button"
    class="btn-close app-action app-action--ghost"
    [appActionState]="isLoading"
    (click)="closeModal('cancel')"
    aria-label="Fechar seleção de foto"
  >
    &times;
  </button>

  <h2 id="upload-photo-title">Selecione uma foto</h2>

  <label class="file-input-label" for="upload-photo-input">
    Escolher imagem
  </label>

  <input
    id="upload-photo-input"
    type="file"
    [attr.accept]="imageAccept"
    class="file-input"
    [appActionState]="isLoading"
    [attr.aria-describedby]="errorMessage
      ? 'upload-photo-help upload-photo-error'
      : 'upload-photo-help'"
    [attr.aria-invalid]="errorMessage ? 'true' : null"
    (change)="onFileSelected($event)"
  />

  <p id="upload-photo-help" class="upload-photo-help">
    Formatos aceitos: {{ imageFormatLabel }}. Tamanho máximo:
    {{ maxUploadMegabytes }} MB. A edição da foto é opcional e acontece somente quando você escolher editar.
  </p>

  @if (errorMessage) {
    <div
      id="upload-photo-error"
      class="alert alert-danger mt-2 app-card app-card--flat app-card--compact"
      role="alert"
      aria-live="assertive"
    >
      {{ errorMessage }}
    </div>
  }
</section>
